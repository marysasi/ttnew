<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduSchedule Pro - Intelligent College Timetable Generator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for in-browser JSX compiling -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <!-- SheetJS (xlsx) for Excel/CSV import and multi-tab export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Custom Styles & Print Stylesheets -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Core CSP Generation Engine & File Export Utilities -->
  <script src="generator.js"></script>
  <script src="exportUtils.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="root">
    <!-- Initial Loading State -->
    <div class="flex items-center justify-center min-h-screen bg-slate-50">
      <div class="text-center p-8 bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md">
        <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="text-xl font-bold text-slate-800 mb-2">EduSchedule Pro v3.0</h2>
        <p class="text-sm text-slate-500">Loading College Timetable Generator Suite...</p>
      </div>
    </div>
  </div>

  <!-- Main React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const STORAGE_KEY = 'college_timetable_generator_v5_data';

    // -------------------------------------------------------------
    // SVG Icons Library
    // -------------------------------------------------------------
    const Icons = {
      Users: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      ),
      BookOpen: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      ),
      Layers: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">

        </svg>
      ),
      Share2: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
        </svg>
      ),
      Lock: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      ),
      Cpu: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
        </svg>
      ),
      Calendar: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      ),
      Grid: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
      ),
      Download: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      ),
      Upload: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
      ),
      Plus: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      ),
      Trash2: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Edit: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      ),
      Check: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      ),
      AlertTriangle: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      ),
      RefreshCw: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      ),
      Search: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      ),
      Printer: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
        </svg>
      ),
      Undo: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M3 10h10a5 5 0 015 5v2m-15-7l4-4m-4 4l4 4" />
        </svg>
      ),
      Coffee: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3" />
        </svg>
      ),
      CheckCircle: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Sparkles: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
      ),
      ExternalLink: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      ),
      Shield: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      ),
    };

    // -------------------------------------------------------------
    // Main App Component
    // -------------------------------------------------------------
    function App() {
      // Core Data State
      const [faculty, setFaculty] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved).faculty || window.TimetableCore.DEFAULT_FACULTY; } catch(e){}
        }
        return window.TimetableCore.DEFAULT_FACULTY;
      });

      const [subjects, setSubjects] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved).subjects || window.TimetableCore.DEFAULT_SUBJECTS; } catch(e){}
        }
        return window.TimetableCore.DEFAULT_SUBJECTS;
      });

      const [sections, setSections] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved).sections || window.TimetableCore.DEFAULT_SECTIONS; } catch(e){}
        }
        return window.TimetableCore.DEFAULT_SECTIONS;
      });

      const [allocations, setAllocations] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved).allocations || window.TimetableCore.DEFAULT_ALLOCATIONS; } catch(e){}
        }
        return window.TimetableCore.DEFAULT_ALLOCATIONS;
      });

      const [prefixedSlots, setPrefixedSlots] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved).prefixedSlots;
            if (Array.isArray(parsed)) {
              // Automatically sanitize out legacy sports & mentoring slots
              const clean = parsed.filter(
                (s) =>
                  !s.label?.toLowerCase().includes('sports') &&
                  !s.label?.toLowerCase().includes('mentoring')
              );
              if (clean.length > 0) return clean;
            }
          } catch (e) {}
        }
        return window.TimetableCore.DEFAULT_PREFIXED_SLOTS;
      });

      const [scheduleConfig, setScheduleConfig] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved).scheduleConfig || window.TimetableCore.DEFAULT_SCHEDULE_CONFIG; } catch(e){}
        }
        return window.TimetableCore.DEFAULT_SCHEDULE_CONFIG;
      });

      const [timetable, setTimetable] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved).timetable || null; } catch(e){}
        }
        return null;
      });

      // UI State (with persistent active step and URL hash sync)
      const [currentStep, setCurrentStep] = useState(() => {
        try {
          const hashMatch = window.location.hash.match(/step-(\d+)/);
          if (hashMatch) {
            const stepNum = Number(hashMatch[1]);
            if (stepNum >= 1 && stepNum <= 9) return stepNum;
          }
          const savedStep = localStorage.getItem('college_timetable_active_step');
          if (savedStep) {
            const num = Number(savedStep);
            if (num >= 1 && num <= 9) return num;
          }
        } catch (e) {
          // ignore
        }
        return 1;
      });

      // Keep active step persisted across reloads and sync hash
      const handleSetStep = (step) => {
        setCurrentStep(step);
        try {
          localStorage.setItem('college_timetable_active_step', String(step));
          window.location.hash = `step-${step}`;
        } catch (e) {}
      };
      const [selectedSectionId, setSelectedSectionId] = useState('sec-2a');
      const [selectedFacultyId, setSelectedFacultyId] = useState('fac-2');
      const [toasts, setToasts] = useState([]);
      const [isGenerating, setIsGenerating] = useState(false);
      const [generationStats, setGenerationStats] = useState(null);
      const [undoStack, setUndoStack] = useState([]);

      // Auto-save to LocalStorage
      useEffect(() => {
        try {
          const payload = {
            faculty,
            subjects,
            sections,
            allocations,
            prefixedSlots,
            scheduleConfig,
            timetable,
            savedAt: new Date().toISOString(),
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (e) {
          console.error('Failed to save to localStorage', e);
        }
      }, [faculty, subjects, sections, allocations, prefixedSlots, scheduleConfig, timetable]);

      const showToast = useCallback((message, type = 'info') => {
        const id = Math.random().toString(36).substring(2, 9);
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 4500);
      }, []);

      const facultyMap = useMemo(() => {
        const map = {};
        faculty.forEach((f) => (map[f.id] = f));
        return map;
      }, [faculty]);

      const subjectsMap = useMemo(() => {
        const map = {};
        subjects.forEach((s) => (map[s.id] = s));
        return map;
      }, [subjects]);

      const sectionsMap = useMemo(() => {
        const map = {};
        sections.forEach((s) => (map[s.id] = s));
        return map;
      }, [sections]);

      // Workload calculation accounting for internal + external other-dept loads
      const facultyWorkloads = useMemo(() => {
        return window.TimetableCore.WorkloadEngine.calculateFacultyWorkloads(faculty, subjects, allocations);
      }, [faculty, subjects, allocations]);

      // Tally Report (takes into account removed/disabled Saturday Period 5)
      const tallyReport = useMemo(() => {
        return window.TimetableCore.TallyEngine.validateAllSectionsReady(sections, subjects, allocations, prefixedSlots, scheduleConfig);
      }, [sections, subjects, allocations, prefixedSlots, scheduleConfig]);

      const handleResetDemoData = () => {
        if (confirm('Reload demo college dataset with Other-Department locked faculty loads and Saturday Period 5 disabled?')) {
          setFaculty(window.TimetableCore.DEFAULT_FACULTY);
          setSubjects(window.TimetableCore.DEFAULT_SUBJECTS);
          setSections(window.TimetableCore.DEFAULT_SECTIONS);
          setAllocations(window.TimetableCore.DEFAULT_ALLOCATIONS);
          setPrefixedSlots(window.TimetableCore.DEFAULT_PREFIXED_SLOTS);
          setScheduleConfig(window.TimetableCore.DEFAULT_SCHEDULE_CONFIG);
          setTimetable(null);
          setUndoStack([]);
          showToast('Sample College Data Loaded Successfully!', 'success');
        }
      };

      const handleAutoBalanceAll = () => {
        let currentSubjects = [...subjects];
        let balancedCount = 0;

        tallyReport.results.forEach((res) => {
          if (res.status !== 'BALANCED' && res.difference !== 0) {
            currentSubjects = window.TimetableCore.TallyEngine.autoBalanceCurriculum(
              res.sectionId,
              currentSubjects,
              allocations,
              res.difference
            );
            balancedCount++;
          }
        });

        setSubjects(currentSubjects);
        showToast(`Auto-balanced pure academic curriculum across sections to match 39 weekly slots! Pure academic balance preserved.`, 'success');
      };

      const handleGenerateTimetable = () => {
        setIsGenerating(true);
        setTimeout(() => {
          try {
            const result = window.TimetableCore.TimetableGenerator.generate({
              sections,
              subjects,
              faculty,
              allocations,
              prefixedSlots,
              scheduleConfig,
              maxAttempts: 250,
            });

            if (result.success) {
              setTimetable(result.timetable);
              setGenerationStats(result.stats);
              setUndoStack([]);
              handleSetStep(7);
              showToast(`Timetable generated in ${result.stats.executionTimeMs}ms! All constraints strictly satisfied.`, 'success');
            } else {
              setTimetable(result.timetable);
              setGenerationStats(result.stats);
              showToast(result.warning || 'Timetable generated with best-effort solver.', 'warning');
              handleSetStep(7);
            }
          } catch (err) {
            console.error('Generation Error', err);
            showToast('Generation encountered an issue: ' + err.message, 'error');
          } finally {
            setIsGenerating(false);
          }
        }, 120);
      };

      const steps = [
        { id: 1, name: 'Faculty & Other Dept', icon: Icons.Users, desc: 'Faculty Directory & External Loads' },
        { id: 2, name: 'Curriculum', icon: Icons.BookOpen, desc: '1st-4th Year Subjects & Labs' },
        { id: 3, name: 'Sections', icon: Icons.Layers, desc: 'Classes, Mentors & Rooms' },
        { id: 4, name: 'Allocation', icon: Icons.Share2, desc: 'Faculty-to-Subject Matrix' },
        { id: 5, name: 'Schedule Rules & Prefix', icon: Icons.Lock, desc: 'Sat P5 Disabled & Tally Engine' },
        { id: 6, name: 'Generate', icon: Icons.Cpu, desc: 'Backtracking CSP Engine' },
        { id: 7, name: 'Master Grid', icon: Icons.Calendar, desc: 'Interactive Timetable & Swaps' },
        { id: 8, name: 'Faculty Matrix', icon: Icons.Grid, desc: 'Workload & Other Dept Locks' },
        { id: 9, name: 'Export & Backup', icon: Icons.Download, desc: 'Excel, PDF & Templates' },
      ];

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* Top Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-100">
                  <Icons.Calendar className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-lg font-bold text-slate-900 leading-tight flex items-center gap-2">
                    EduSchedule Pro
                    <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                      College Edition v3.0
                    </span>
                  </h1>
                  <p className="text-xs text-slate-500">Autonomous CSP Timetable Generator &bull; Saturday P5 Disabled &bull; Other-Dept Locks</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                {/* Tally Balance Badge */}
                <div 
                  onClick={() => handleSetStep(5)}
                  className={`cursor-pointer px-3 py-1.5 rounded-full text-xs font-medium flex items-center space-x-1.5 transition-all ${
                    tallyReport.isReady 
                      ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' 
                      : 'bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 animate-pulse'
                  }`}
                  title="Click to view Pre-Flight Tally Reconciliation Engine"
                >
                  {tallyReport.isReady ? <Icons.CheckCircle className="w-4 h-4 text-emerald-600" /> : <Icons.AlertTriangle className="w-4 h-4 text-amber-600" />}
                  <span>{tallyReport.isReady ? 'Tally: Balanced' : `Tally: ${tallyReport.totalShort} Short / ${tallyReport.totalOverflow} Excess`}</span>
                </div>

                <button
                  onClick={handleGenerateTimetable}
                  disabled={isGenerating}
                  className="inline-flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-all disabled:opacity-50"
                >
                  <Icons.Sparkles className={`w-4 h-4 ${isGenerating ? 'animate-spin' : ''}`} />
                  <span>{isGenerating ? 'Generating...' : 'Auto-Generate'}</span>
                </button>

                <button
                  onClick={handleResetDemoData}
                  className="px-3 py-2 text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-xl transition"
                  title="Reload sample college dataset"
                >
                  <Icons.RefreshCw className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Stepper Navigation */}
            <div className="border-t border-slate-100 overflow-x-auto">
              <div className="max-w-7xl mx-auto px-4 flex space-x-1 py-1.5 min-w-max">
                {steps.map((s) => {
                  const Icon = s.icon;
                  const isActive = currentStep === s.id;
                  return (
                    <button
                      key={s.id}
                      onClick={() => handleSetStep(s.id)}
                      className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-medium transition-all ${
                        isActive
                          ? 'bg-indigo-50 text-indigo-700 font-semibold shadow-sm border border-indigo-100'
                          : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                      }`}
                    >
                      <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${
                        isActive ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-600'
                      }`}>
                        {s.id}
                      </span>
                      <span>{s.name}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </header>

          {/* Main Content Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {currentStep === 1 && (
              <FacultyManagementStep
                faculty={faculty}
                setFaculty={setFaculty}
                facultyWorkloads={facultyWorkloads}
                showToast={showToast}
              />
            )}

            {currentStep === 2 && (
              <SubjectCurriculumStep
                subjects={subjects}
                setSubjects={setSubjects}
                showToast={showToast}
              />
            )}

            {currentStep === 3 && (
              <ClassSectionStep
                sections={sections}
                setSections={setSections}
                faculty={faculty}
                subjects={subjects}
                allocations={allocations}
                setAllocations={setAllocations}
                showToast={showToast}
              />
            )}

            {currentStep === 4 && (
              <AllocationStep
                sections={sections}
                subjects={subjects}
                faculty={faculty}
                allocations={allocations}
                setAllocations={setAllocations}
                facultyWorkloads={facultyWorkloads}
                showToast={showToast}
              />
            )}

            {currentStep === 5 && (
              <TimetableConfigAndPrefixStep
                sections={sections}
                subjects={subjects}
                faculty={faculty}
                prefixedSlots={prefixedSlots}
                setPrefixedSlots={setPrefixedSlots}
                scheduleConfig={scheduleConfig}
                setScheduleConfig={setScheduleConfig}
                allocations={allocations}
                setAllocations={setAllocations}
                tallyReport={tallyReport}
                onAutoBalanceAll={handleAutoBalanceAll}
                showToast={showToast}
              />
            )}

            {currentStep === 6 && (
              <GenerationStep
                sections={sections}
                subjects={subjects}
                faculty={faculty}
                allocations={allocations}
                prefixedSlots={prefixedSlots}
                scheduleConfig={scheduleConfig}
                tallyReport={tallyReport}
                onGenerate={handleGenerateTimetable}
                isGenerating={isGenerating}
                generationStats={generationStats}
                hasGeneratedTimetable={!!timetable}
                onViewMaster={() => handleSetStep(7)}
                onAutoBalance={handleAutoBalanceAll}
              />
            )}

            {currentStep === 7 && (
              <MasterTimetableStep
                timetable={timetable}
                setTimetable={setTimetable}
                sections={sections}
                subjects={subjects}
                faculty={faculty}
                facultyMap={facultyMap}
                scheduleConfig={scheduleConfig}
                selectedSectionId={selectedSectionId}
                setSelectedSectionId={setSelectedSectionId}
                showToast={showToast}
                undoStack={undoStack}
                setUndoStack={setUndoStack}
                onRegenerate={handleGenerateTimetable}
              />
            )}

            {currentStep === 8 && (
              <FacultyMatrixStep
                faculty={faculty}
                timetable={timetable}
                sections={sections}
                subjects={subjects}
                scheduleConfig={scheduleConfig}
                selectedFacultyId={selectedFacultyId}
                setSelectedFacultyId={setSelectedFacultyId}
                setFaculty={setFaculty}
                showToast={showToast}
                setTimetable={setTimetable}
                allocations={allocations}
              />
            )}

            {currentStep === 9 && (
              <ExportCenterStep
                timetable={timetable}
                sections={sections}
                subjects={subjects}
                faculty={faculty}
                allocations={allocations}
                prefixedSlots={prefixedSlots}
                scheduleConfig={scheduleConfig}
                setFaculty={setFaculty}
                setSubjects={setSubjects}
                setSections={setSections}
                setAllocations={setAllocations}
                setPrefixedSlots={setPrefixedSlots}
                setScheduleConfig={setScheduleConfig}
                setTimetable={setTimetable}
                showToast={showToast}
              />
            )}
          </main>

          {/* Toast Notification Container */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none">
            {toasts.map((toast) => (
              <div
                key={toast.id}
                className={`pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center space-x-2.5 transition-all ${
                  toast.type === 'success'
                    ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
                    : toast.type === 'error'
                    ? 'bg-rose-50 border-rose-200 text-rose-800'
                    : toast.type === 'warning'
                    ? 'bg-amber-50 border-amber-200 text-amber-800'
                    : 'bg-indigo-50 border-indigo-200 text-indigo-800'
                }`}
              >
                {toast.type === 'success' && <Icons.CheckCircle className="w-5 h-5 text-emerald-600 flex-shrink-0" />}
                {toast.type === 'error' && <Icons.AlertTriangle className="w-5 h-5 text-rose-600 flex-shrink-0" />}
                {toast.type === 'warning' && <Icons.AlertTriangle className="w-5 h-5 text-amber-600 flex-shrink-0" />}
                {toast.type === 'info' && <Icons.Sparkles className="w-5 h-5 text-indigo-600 flex-shrink-0" />}
                <span>{toast.message}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 1: Faculty Management & Other-Department Locked Load
    // -------------------------------------------------------------
    function FacultyManagementStep({ faculty, setFaculty, facultyWorkloads, showToast }) {
      const [search, setSearch] = useState('');
      const [deptFilter, setDeptFilter] = useState('ALL');
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingFaculty, setEditingFaculty] = useState(null);
      const [externalLoadFaculty, setExternalLoadFaculty] = useState(null); // For Managing Other-Dept Locks

      const [formData, setFormData] = useState({
        name: '',
        empId: '',
        department: 'CSE',
        designation: 'Assistant Professor',
        email: '',
        maxWorkloadHours: 18,
      });

      // External load form
      const [extForm, setExtForm] = useState({
        day: 'Tuesday',
        period: 2,
        department: 'ECE',
        subject: 'Microprocessors',
        hours: 1,
      });

      const filtered = useMemo(() => {
        return faculty.filter((f) => {
          const matchSearch = f.name.toLowerCase().includes(search.toLowerCase()) || 
                              f.department.toLowerCase().includes(search.toLowerCase()) ||
                              (f.empId && f.empId.toLowerCase().includes(search.toLowerCase()));
          const matchDept = deptFilter === 'ALL' || f.department === deptFilter;
          return matchSearch && matchDept;
        });
      }, [faculty, search, deptFilter]);

      const departments = useMemo(() => Array.from(new Set(faculty.map((f) => f.department))), [faculty]);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        try {
          const rawRows = await window.ExportUtils.parseFile(file);
          const { valid, errors } = window.ExportUtils.normalizeFacultyImport(rawRows);

          if (valid.length === 0) {
            showToast('No valid faculty records found in file.', 'error');
            return;
          }

          setFaculty((prev) => [...prev, ...valid]);
          showToast(`Successfully imported ${valid.length} faculty members!`, 'success');
        } catch (err) {
          showToast('Failed to parse file: ' + err.message, 'error');
        } finally {
          e.target.value = '';
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) return;

        if (editingFaculty) {
          setFaculty((prev) =>
            prev.map((f) =>
              f.id === editingFaculty.id
                ? { ...f, ...formData, maxWorkloadHours: Number(formData.maxWorkloadHours) }
                : f
            )
          );
          showToast(`Updated ${formData.name}`, 'success');
        } else {
          const newFaculty = {
            id: 'fac-' + Math.random().toString(36).substring(2, 9),
            ...formData,
            maxWorkloadHours: Number(formData.maxWorkloadHours),
            color: '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'),
            externalLoads: [],
          };
          setFaculty((prev) => [...prev, newFaculty]);
          showToast(`Added ${formData.name}`, 'success');
        }

        setShowAddModal(false);
        setEditingFaculty(null);
      };

      const handleEdit = (fac) => {
        setEditingFaculty(fac);
        setFormData({
          name: fac.name,
          empId: fac.empId || '',
          department: fac.department,
          designation: fac.designation,
          email: fac.email || '',
          maxWorkloadHours: fac.maxWorkloadHours,
        });
        setShowAddModal(true);
      };

      const handleDelete = (id, name) => {
        if (confirm(`Remove ${name} from faculty directory?`)) {
          setFaculty((prev) => prev.filter((f) => f.id !== id));
          showToast(`Removed ${name}`, 'info');
        }
      };

      // Add External Other-Department Locked Slot
      const handleAddExternalLoad = (e) => {
        e.preventDefault();
        if (!externalLoadFaculty) return;

        // Saturday Period 5 is disabled rule
        if (extForm.day === 'Saturday' && Number(extForm.period) === 5) {
          alert('Cannot schedule on Saturday Period 5: This period is strictly disabled across all college schedules.');
          return;
        }

        const newExt = {
          id: 'ext-' + Math.random().toString(36).substring(2, 9),
          day: extForm.day,
          period: Number(extForm.period),
          department: extForm.department.toUpperCase(),
          subject: extForm.subject,
          hours: Number(extForm.hours) || 1,
        };

        setFaculty((prev) =>
          prev.map((f) => {
            if (f.id === externalLoadFaculty.id) {
              const current = f.externalLoads || [];
              return { ...f, externalLoads: [...current, newExt] };
            }
            return f;
          })
        );

        // Update local modal state
        setExternalLoadFaculty((prev) => ({
          ...prev,
          externalLoads: [...(prev.externalLoads || []), newExt],
        }));

        showToast(`Locked other-dept slot for ${externalLoadFaculty.name}: ${newExt.department} (${newExt.day} P${newExt.period})`, 'success');
      };

      const handleDeleteExternalLoad = (extId) => {
        if (!externalLoadFaculty) return;
        setFaculty((prev) =>
          prev.map((f) => {
            if (f.id === externalLoadFaculty.id) {
              return { ...f, externalLoads: (f.externalLoads || []).filter((e) => e.id !== extId) };
            }
            return f;
          })
        );

        setExternalLoadFaculty((prev) => ({
          ...prev,
          externalLoads: (prev.externalLoads || []).filter((e) => e.id !== extId),
        }));

        showToast('Removed other-department locked slot.', 'info');
      };

      return (
        <div className="space-y-6">
          {/* Header Card */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Icons.Users className="w-6 h-6 text-indigo-600" />
                Faculty Directory & External Locked Load
              </h2>
              <p className="text-sm text-slate-500 mt-1">
                Manage faculty workloads and lock unavailable slots for staff teaching in <strong>other departments</strong> (ECE, MECH, IT, etc.).
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2.5">
              <button
                onClick={() => window.ExportUtils.downloadFacultyTemplate('xlsx')}
                className="px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center space-x-1.5 transition"
              >
                <Icons.Download className="w-4 h-4 text-slate-500" />
                <span>Sample Template (.xlsx)</span>
              </button>

              <label className="cursor-pointer px-3.5 py-2 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-xl flex items-center space-x-1.5 border border-indigo-200 transition">
                <Icons.Upload className="w-4 h-4 text-indigo-600" />
                <span>Import Excel / CSV</span>
                <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
              </label>

              <button
                onClick={() => {
                  setEditingFaculty(null);
                  setFormData({
                    name: '',
                    empId: 'EMP' + Math.floor(100 + Math.random() * 900),
                    department: 'CSE',
                    designation: 'Assistant Professor',
                    email: '',
                    maxWorkloadHours: 18,
                  });
                  setShowAddModal(true);
                }}
                className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm shadow-indigo-200 flex items-center space-x-1.5 transition"
              >
                <Icons.Plus className="w-4 h-4" />
                <span>Add Faculty</span>
              </button>
            </div>
          </div>

          {/* Quick Stats Grid */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Faculty</span>
              <p className="text-2xl font-bold text-slate-900 mt-1">{faculty.length}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Other-Dept Locked Slots</span>
              <p className="text-2xl font-bold text-amber-600 mt-1">
                {faculty.reduce((sum, f) => sum + (f.externalLoads ? f.externalLoads.length : 0), 0)} <span className="text-sm font-normal text-slate-400">slots</span>
              </p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Weekly Capacity</span>
              <p className="text-2xl font-bold text-emerald-600 mt-1">
                {faculty.reduce((sum, f) => sum + (Number(f.maxWorkloadHours) || 0), 0)} <span className="text-sm font-normal text-slate-400">hrs</span>
              </p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Avg Max Workload</span>
              <p className="text-2xl font-bold text-slate-700 mt-1">
                {faculty.length ? Math.round(faculty.reduce((sum, f) => sum + (Number(f.maxWorkloadHours) || 0), 0) / faculty.length) : 0} <span className="text-sm font-normal text-slate-400">hrs/wk</span>
              </p>
            </div>
          </div>

          {/* Search & Filter */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 justify-between items-center">
            <div className="relative w-full sm:w-80">
              <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-3" />
              <input
                type="text"
                placeholder="Search by faculty, ID or department..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full pl-10 pr-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50"
              />
            </div>

            <div className="flex items-center space-x-2 w-full sm:w-auto">
              <span className="text-xs font-semibold text-slate-500">Department:</span>
              <select
                value={deptFilter}
                onChange={(e) => setDeptFilter(e.target.value)}
                className="text-xs font-medium border border-slate-200 rounded-xl px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <option value="ALL">All Departments</option>
                {departments.map((d) => (
                  <option key={d} value={d}>{d}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Interactive Faculty Table */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider border-b border-slate-200">
                  <tr>
                    <th className="px-6 py-4">Faculty Member</th>
                    <th className="px-6 py-4">Department & Role</th>
                    <th className="px-6 py-4">Other-Dept Locked Load</th>
                    <th className="px-6 py-4">Total Workload (Assigned / Max)</th>
                    <th className="px-6 py-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filtered.map((fac) => {
                    const load = facultyWorkloads[fac.id] || { totalAssigned: 0, maxWorkload: fac.maxWorkloadHours, externalHours: 0 };
                    const pct = Math.min(Math.round((load.totalAssigned / load.maxWorkload) * 100), 100);
                    const isOver = load.totalAssigned > load.maxWorkload;
                    const extLoads = fac.externalLoads || [];

                    return (
                      <tr key={fac.id} className="hover:bg-slate-50/70 transition">
                        <td className="px-6 py-4 whitespace-nowrap">
                          <div className="flex items-center space-x-3">
                            <div
                              className="w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-sm"
                              style={{ backgroundColor: fac.color || '#4f46e5' }}
                            >
                              {fac.name.split(' ').map((n) => n[0]).slice(0, 2).join('')}
                            </div>
                            <div>
                              <p className="font-semibold text-slate-900">{fac.name}</p>
                              <p className="text-xs text-slate-400 font-mono">{fac.empId || 'EMP-N/A'}</p>
                            </div>
                          </div>
                        </td>

                        <td className="px-6 py-4 whitespace-nowrap">
                          <span className="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100 mr-2">
                            {fac.department}
                          </span>
                          <span className="text-xs text-slate-600 font-medium">{fac.designation}</span>
                        </td>

                        {/* Other-Dept Locked Load Status */}
                        <td className="px-6 py-4 whitespace-nowrap">
                          <div className="flex items-center space-x-2">
                            {extLoads.length > 0 ? (
                              <button
                                onClick={() => setExternalLoadFaculty(fac)}
                                className="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-50 text-amber-800 border border-amber-300 hover:bg-amber-100 flex items-center space-x-1.5 transition"
                                title="Click to view and edit external locked slots"
                              >
                                <Icons.Lock className="w-3.5 h-3.5 text-amber-600" />
                                <span>{extLoads.length} Locked Slot{extLoads.length > 1 ? 's' : ''} ({load.externalHours}h)</span>
                              </button>
                            ) : (
                              <button
                                onClick={() => setExternalLoadFaculty(fac)}
                                className="text-xs text-slate-400 hover:text-indigo-600 font-medium flex items-center space-x-1"
                              >
                                <Icons.Plus className="w-3.5 h-3.5" />
                                <span>Add Other-Dept Lock</span>
                              </button>
                            )}
                          </div>
                        </td>

                        {/* Total Workload Progress Bar (Internal + External) */}
                        <td className="px-6 py-4 whitespace-nowrap min-w-[220px]">
                          <div className="flex items-center justify-between text-xs mb-1">
                            <span className="font-semibold text-slate-700">
                              {load.totalAssigned} / {load.maxWorkload} hrs
                              {load.externalHours > 0 && (
                                <span className="text-[10px] text-amber-700 font-bold ml-1.5">
                                  ({load.totalInternalAssigned}h int + {load.externalHours}h ext)
                                </span>
                              )}
                            </span>
                            <span
                              className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                isOver
                                  ? 'bg-rose-100 text-rose-700'
                                  : pct >= 85
                                  ? 'bg-amber-100 text-amber-700'
                                  : 'bg-emerald-100 text-emerald-700'
                              }`}
                            >
                              {isOver ? 'OVERLOADED' : `${pct}% Utilized`}
                            </span>
                          </div>
                          <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                            <div
                              className={`h-2 rounded-full transition-all ${
                                isOver ? 'bg-rose-500' : pct >= 85 ? 'bg-amber-500' : 'bg-emerald-500'
                              }`}
                              style={{ width: `${pct}%` }}
                            ></div>
                          </div>
                        </td>

                        <td className="px-6 py-4 whitespace-nowrap text-right space-x-2">
                          <button
                            onClick={() => setExternalLoadFaculty(fac)}
                            className="p-1.5 text-slate-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition"
                            title="Manage External / Other-Department Locks"
                          >
                            <Icons.Lock className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => handleEdit(fac)}
                            className="p-1.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition"
                            title="Edit Faculty"
                          >
                            <Icons.Edit className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => handleDelete(fac.id, fac.name)}
                            className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                            title="Delete Faculty"
                          >
                            <Icons.Trash2 className="w-4 h-4" />
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Modal: Manage Other-Department Locked Load for Faculty */}
          {externalLoadFaculty && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-amber-200 max-w-lg w-full p-6 animate-in fade-in zoom-in duration-150">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <Icons.Lock className="w-5 h-5 text-amber-600" />
                      Other-Department Locked Load
                    </h3>
                    <p className="text-xs text-slate-500">
                      Faculty: <strong className="text-slate-800">{externalLoadFaculty.name}</strong> ({externalLoadFaculty.department})
                    </p>
                  </div>
                  <button onClick={() => setExternalLoadFaculty(null)} className="text-slate-400 hover:text-slate-600 text-xl">
                    &times;
                  </button>
                </div>

                {/* Notice on Scheduling Rules */}
                <div className="p-3 bg-amber-50/80 border border-amber-200 rounded-xl text-xs text-amber-900 mb-4 flex items-start space-x-2">
                  <Icons.AlertTriangle className="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5" />
                  <p>
                    These slots are permanently locked as <strong>"LOCKED - OTHER DEPT"</strong>. The CSP algorithm will treat them as impassable collision barriers and strictly forbid assigning internal department classes during these periods.
                  </p>
                </div>

                {/* Existing External Locks List */}
                <div className="space-y-2 mb-5">
                  <h4 className="text-xs font-semibold text-slate-600 uppercase tracking-wider">Current Locked External Slots:</h4>
                  {(!externalLoadFaculty.externalLoads || externalLoadFaculty.externalLoads.length === 0) ? (
                    <p className="text-xs text-slate-400 italic bg-slate-50 p-3 rounded-xl border border-slate-100">
                      No other-department commitments locked yet.
                    </p>
                  ) : (
                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                      {externalLoadFaculty.externalLoads.map((ext) => (
                        <div
                          key={ext.id}
                          className="p-2.5 rounded-xl border border-amber-200 bg-amber-50/60 flex items-center justify-between text-xs"
                        >
                          <div>
                            <span className="font-bold text-amber-900 mr-2">[{ext.department} Dept]</span>
                            <span className="font-semibold text-slate-800">{ext.subject}</span>
                            <span className="block text-[11px] text-slate-500 font-mono mt-0.5">
                              {ext.day} &bull; Period {ext.period} ({ext.hours} hr)
                            </span>
                          </div>
                          <button
                            onClick={() => handleDeleteExternalLoad(ext.id)}
                            className="p-1 text-slate-400 hover:text-rose-600 rounded transition"
                            title="Remove External Lock"
                          >
                            <Icons.Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Form to Add New External Locked Slot */}
                <form onSubmit={handleAddExternalLoad} className="space-y-3 pt-3 border-t border-slate-100">
                  <h4 className="text-xs font-semibold text-slate-800">Add Locked External Slot:</h4>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Day of Week *</label>
                      <select
                        value={extForm.day}
                        onChange={(e) => setExtForm({ ...extForm, day: e.target.value })}
                        className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 bg-white"
                      >
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday (Periods 1-4 only)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Period Number *</label>
                      <select
                        value={extForm.period}
                        onChange={(e) => setExtForm({ ...extForm, period: Number(e.target.value) })}
                        className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 bg-white"
                      >
                        <option value={1}>Period 1 (09:00 - 09:50)</option>
                        <option value={2}>Period 2 (09:50 - 10:40)</option>
                        <option value={3}>Period 3 (10:55 - 11:45)</option>
                        <option value={4}>Period 4 (11:45 - 12:35)</option>
                        <option value={5} disabled={extForm.day === 'Saturday'}>
                          Period 5 (01:30 - 02:20) {extForm.day === 'Saturday' ? '(DISABLED ON SATURDAY)' : ''}
                        </option>
                        <option value={6} disabled={extForm.day === 'Saturday'}>
                          Period 6 (02:20 - 03:10)
                        </option>
                        <option value={7} disabled={extForm.day === 'Saturday'}>
                          Period 7 (03:10 - 04:00)
                        </option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Target Department *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. ECE, MECH, CIVIL"
                        value={extForm.department}
                        onChange={(e) => setExtForm({ ...extForm, department: e.target.value.toUpperCase() })}
                        className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Course / Subject Taught</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Embedded Systems"
                        value={extForm.subject}
                        onChange={(e) => setExtForm({ ...extForm, subject: e.target.value })}
                        className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="submit"
                      className="px-4 py-2 text-xs font-semibold text-white bg-amber-600 hover:bg-amber-700 rounded-xl shadow-sm transition"
                    >
                      + Lock External Slot
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add / Edit Faculty Modal */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 animate-in fade-in zoom-in duration-150">
                <div className="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                  <h3 className="text-lg font-bold text-slate-900">
                    {editingFaculty ? 'Edit Faculty Details' : 'Add New Faculty Member'}
                  </h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600 text-xl leading-none">
                    &times;
                  </button>
                </div>

                <form onSubmit={handleSave} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Faculty Full Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Dr. Priya Sharma"
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Employee ID</label>
                      <input
                        type="text"
                        placeholder="e.g. EMP102"
                        value={formData.empId}
                        onChange={(e) => setFormData({ ...formData, empId: e.target.value })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 font-mono text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Department *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. CSE"
                        value={formData.department}
                        onChange={(e) => setFormData({ ...formData, department: e.target.value.toUpperCase() })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Designation</label>
                      <select
                        value={formData.designation}
                        onChange={(e) => setFormData({ ...formData, designation: e.target.value })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white"
                      >
                        <option value="Professor & HOD">Professor & HOD</option>
                        <option value="Professor">Professor</option>
                        <option value="Associate Professor">Associate Professor</option>
                        <option value="Assistant Professor">Assistant Professor</option>
                        <option value="Adjunct Faculty">Adjunct Faculty</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Max Workload (Hours/Wk) *</label>
                      <input
                        type="number"
                        min="4"
                        max="35"
                        required
                        value={formData.maxWorkloadHours}
                        onChange={(e) => setFormData({ ...formData, maxWorkloadHours: e.target.value })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
                    <input
                      type="email"
                      placeholder="e.g. faculty@college.edu"
                      value={formData.email}
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md shadow-indigo-100 transition"
                    >
                      {editingFaculty ? 'Save Changes' : 'Add Faculty'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 2: Subject & Curriculum Management
    // -------------------------------------------------------------
    function SubjectCurriculumStep({ subjects, setSubjects, showToast }) {
      const [yearFilter, setYearFilter] = useState('ALL');
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [search, setSearch] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [editingSubject, setEditingSubject] = useState(null);

      const [formData, setFormData] = useState({
        code: '',
        name: '',
        year: 2,
        department: 'CSE',
        theoryHoursPerWeek: 4,
        labHoursPerWeek: 0,
        isLab: false,
      });

      const filtered = useMemo(() => {
        return subjects.filter((s) => {
          const matchYear = yearFilter === 'ALL' || s.year === Number(yearFilter);
          const matchType = typeFilter === 'ALL' || (typeFilter === 'LAB' ? s.isLab : !s.isLab);
          const matchSearch = s.name.toLowerCase().includes(search.toLowerCase()) || 
                              s.code.toLowerCase().includes(search.toLowerCase()) ||
                              s.department.toLowerCase().includes(search.toLowerCase());
          return matchYear && matchType && matchSearch;
        });
      }, [subjects, yearFilter, typeFilter, search]);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        try {
          const rawRows = await window.ExportUtils.parseFile(file);
          const { valid, errors } = window.ExportUtils.normalizeSubjectImport(rawRows);

          if (valid.length === 0) {
            showToast('No valid subject records found in file.', 'error');
            return;
          }

          setSubjects((prev) => [...prev, ...valid]);
          showToast(`Successfully imported ${valid.length} curriculum courses!`, 'success');
        } catch (err) {
          showToast('Failed to parse subjects file: ' + err.message, 'error');
        } finally {
          e.target.value = '';
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.code.trim() || !formData.name.trim()) return;

        const payload = {
          ...formData,
          code: formData.code.toUpperCase().trim(),
          year: Number(formData.year),
          theoryHoursPerWeek: formData.isLab ? 0 : Number(formData.theoryHoursPerWeek),
          labHoursPerWeek: formData.isLab ? Number(formData.labHoursPerWeek) || 3 : Number(formData.labHoursPerWeek) || 0,
        };

        if (editingSubject) {
          setSubjects((prev) => prev.map((s) => (s.id === editingSubject.id ? { ...s, ...payload } : s)));
          showToast(`Updated ${payload.code}`, 'success');
        } else {
          setSubjects((prev) => [
            ...prev,
            {
              id: 'sub-' + Math.random().toString(36).substring(2, 9),
              ...payload,
              color: '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'),
            },
          ]);
          showToast(`Added ${payload.code} - ${payload.name}`, 'success');
        }

        setShowModal(false);
        setEditingSubject(null);
      };

      const handleEdit = (sub) => {
        setEditingSubject(sub);
        setFormData({
          code: sub.code,
          name: sub.name,
          year: sub.year,
          department: sub.department,
          theoryHoursPerWeek: sub.theoryHoursPerWeek,
          labHoursPerWeek: sub.labHoursPerWeek,
          isLab: sub.isLab,
        });
        setShowModal(true);
      };

      const handleDelete = (id, code) => {
        if (confirm(`Delete subject ${code}?`)) {
          setSubjects((prev) => prev.filter((s) => s.id !== id));
          showToast(`Deleted ${code}`, 'info');
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Icons.BookOpen className="w-6 h-6 text-indigo-600" />
                Curriculum & Subject Management
              </h2>
              <p className="text-sm text-slate-500 mt-1">
                Maintain 1st to 4th Year engineering curriculum courses, theory hours, and continuous laboratory blocks.
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2.5">
              <button
                onClick={() => window.ExportUtils.downloadSubjectTemplate('xlsx')}
                className="px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center space-x-1.5 transition"
              >
                <Icons.Download className="w-4 h-4 text-slate-500" />
                <span>Sample Template (.xlsx)</span>
              </button>

              <label className="cursor-pointer px-3.5 py-2 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-xl flex items-center space-x-1.5 border border-indigo-200 transition">
                <Icons.Upload className="w-4 h-4 text-indigo-600" />
                <span>Import Excel / CSV</span>
                <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
              </label>

              <button
                onClick={() => {
                  setEditingSubject(null);
                  setFormData({
                    code: '',
                    name: '',
                    year: 2,
                    department: 'CSE',
                    theoryHoursPerWeek: 4,
                    labHoursPerWeek: 0,
                    isLab: false,
                  });
                  setShowModal(true);
                }}
                className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm shadow-indigo-200 flex items-center space-x-1.5 transition"
              >
                <Icons.Plus className="w-4 h-4" />
                <span>Add Subject</span>
              </button>
            </div>
          </div>

          {/* Filter Bar */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
            <div className="flex items-center space-x-1">
              {[
                { id: 'ALL', label: 'All Years' },
                { id: '1', label: '1st Year' },
                { id: '2', label: '2nd Year' },
                { id: '3', label: '3rd Year' },
                { id: '4', label: '4th Year' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setYearFilter(tab.id)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition ${
                    yearFilter === tab.id
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            <div className="flex items-center space-x-3">
              <select
                value={typeFilter}
                onChange={(e) => setTypeFilter(e.target.value)}
                className="text-xs font-medium border border-slate-200 rounded-xl px-3 py-1.5 bg-white focus:outline-none"
              >
                <option value="ALL">All Course Types</option>
                <option value="THEORY">Theory Only</option>
                <option value="LAB">Laboratory Only</option>
              </select>

              <div className="relative">
                <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" />
                <input
                  type="text"
                  placeholder="Filter subjects..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  className="pl-9 pr-3 py-1.5 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 w-48"
                />
              </div>
            </div>
          </div>

          {/* Cards Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map((sub) => (
              <div
                key={sub.id}
                className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:border-indigo-300 transition-all flex flex-col justify-between"
              >
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="font-mono text-xs font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-800 border border-slate-200">
                      {sub.code}
                    </span>
                    <div className="flex items-center space-x-1.5">
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">
                        Year {sub.year}
                      </span>
                      <span
                        className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                          sub.isLab ? 'bg-fuchsia-50 text-fuchsia-700 border border-fuchsia-200' : 'bg-blue-50 text-blue-700 border border-blue-200'
                        }`}
                      >
                        {sub.isLab ? 'LABORATORY' : 'THEORY'}
                      </span>
                    </div>
                  </div>

                  <h3 className="font-bold text-slate-900 text-base leading-snug">{sub.name}</h3>
                  <p className="text-xs text-slate-500 mt-1 font-medium">{sub.department} Department</p>
                </div>

                <div className="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between">
                  <div className="flex items-center space-x-3 text-xs text-slate-600">
                    {!sub.isLab && (
                      <span>
                        <strong className="text-slate-900">{sub.theoryHoursPerWeek}</strong> Theory hrs
                      </span>
                    )}
                    {sub.labHoursPerWeek > 0 && (
                      <span className="text-fuchsia-700 font-medium">
                        <strong>{sub.labHoursPerWeek}</strong> Continuous Lab hrs
                      </span>
                    )}
                  </div>

                  <div className="flex items-center space-x-1">
                    <button
                      onClick={() => handleEdit(sub)}
                      className="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg transition"
                    >
                      <Icons.Edit className="w-4 h-4" />
                    </button>
                    <button
                      onClick={() => handleDelete(sub.id, sub.code)}
                      className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition"
                    >
                      <Icons.Trash2 className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Add Subject Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 animate-in fade-in zoom-in duration-150">
                <div className="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                  <h3 className="text-lg font-bold text-slate-900">
                    {editingSubject ? 'Edit Subject Details' : 'Add Curriculum Subject'}
                  </h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600 text-xl">
                    &times;
                  </button>
                </div>

                <form onSubmit={handleSave} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Subject Code *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. CS201"
                        value={formData.code}
                        onChange={(e) => setFormData({ ...formData, code: e.target.value.toUpperCase() })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 font-mono"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Academic Year *</label>
                      <select
                        value={formData.year}
                        onChange={(e) => setFormData({ ...formData, year: Number(e.target.value) })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white"
                      >
                        <option value={1}>1st Year</option>
                        <option value={2}>2nd Year</option>
                        <option value={3}>3rd Year</option>
                        <option value={4}>4th Year</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Subject Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Data Structures & Algorithms"
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
