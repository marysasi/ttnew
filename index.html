                      <label className="block text-xs font-semibold text-slate-600 mb-1">Department</label>
                      <input
                        type="text"
                        required
                        value={formData.department}
                        onChange={(e) => setFormData({ ...formData, department: e.target.value.toUpperCase() })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Is Laboratory Subject?</label>
                      <div className="flex items-center space-x-2 pt-2">
                        <input
                          type="checkbox"
                          id="isLabCheck"
                          checked={formData.isLab}
                          onChange={(e) => setFormData({ ...formData, isLab: e.target.checked })}
                          className="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
                        />
                        <label htmlFor="isLabCheck" className="text-xs font-medium text-slate-700 cursor-pointer">
                          Practical Lab Course
                        </label>
                      </div>
                    </div>
                  </div>

                  {!formData.isLab ? (
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Theory Hours / Week</label>
                      <input
                        type="number"
                        min="1"
                        max="8"
                        required
                        value={formData.theoryHoursPerWeek}
                        onChange={(e) => setFormData({ ...formData, theoryHoursPerWeek: Number(e.target.value) })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  ) : (
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Continuous Lab Block Duration</label>
                      <select
                        value={formData.labHoursPerWeek}
                        onChange={(e) => setFormData({ ...formData, labHoursPerWeek: Number(e.target.value) })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white"
                      >
                        <option value={2}>2 Continuous Periods (e.g. Periods 1-2 or 6-7)</option>
                        <option value={3}>3 Continuous Periods (e.g. Periods 1-3 or 5-7)</option>
                      </select>
                      <p className="text-[11px] text-fuchsia-600 mt-1 font-medium">
                        * Scheduled in continuous periods; strictly never crossing lunch break.
                      </p>
                    </div>
                  )}

                  <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md shadow-indigo-100 transition"
                    >
                      {editingSubject ? 'Save Changes' : 'Add Subject'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 3: Class & Section Configuration
    // -------------------------------------------------------------
    function ClassSectionStep({ sections, setSections, faculty, subjects, allocations, setAllocations, showToast }) {
      const [showModal, setShowModal] = useState(false);
      const [formData, setFormData] = useState({
        year: 2,
        name: 'Section C',
        department: 'CSE',
        roomNumber: 'LH-203',
        labRoom: 'Software Lab C',
        mentorFacultyId: '',
      });

      const sectionsByYear = useMemo(() => {
        const groups = { 1: [], 2: [], 3: [], 4: [] };
        sections.forEach((sec) => {
          if (groups[sec.year]) groups[sec.year].push(sec);
        });
        return groups;
      }, [sections]);

      const handleAddSection = (e) => {
        e.preventDefault();
        const newSec = {
          id: 'sec-' + Math.random().toString(36).substring(2, 9),
          year: Number(formData.year),
          name: formData.name,
          department: formData.department,
          roomNumber: formData.roomNumber,
          labRoom: formData.labRoom,
          mentorFacultyId: formData.mentorFacultyId || (faculty[0] ? faculty[0].id : ''),
        };

        setSections((prev) => [...prev, newSec]);

        const yearSubjects = subjects.filter((s) => s.year === newSec.year);
        const newAllocations = yearSubjects.map((sub) => ({
          sectionId: newSec.id,
          subjectId: sub.id,
          facultyIds: [],
        }));
        setAllocations((prev) => [...prev, ...newAllocations]);

        showToast(`Added ${newSec.name} for Year ${newSec.year} with automatic workload sync!`, 'success');
        setShowModal(false);
      };

      const handleDeleteSection = (id, label) => {
        if (confirm(`Remove section "${label}"? This will also remove associated subject allocations.`)) {
          setSections((prev) => prev.filter((s) => s.id !== id));
          setAllocations((prev) => prev.filter((a) => a.sectionId !== id));
          showToast(`Removed section ${label}`, 'info');
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Icons.Layers className="w-6 h-6 text-indigo-600" />
                Class & Section Architecture
              </h2>
              <p className="text-sm text-slate-500 mt-1">
                Configure sections per academic year, assign dedicated Class Mentors/Tutors, and define classroom venues.
              </p>
            </div>

            <button
              onClick={() => {
                setFormData({
                  year: 2,
                  name: `Section ${String.fromCharCode(65 + (sectionsByYear[2] ? sectionsByYear[2].length : 0))}`,
                  department: 'CSE',
                  roomNumber: `LH-20${(sectionsByYear[2] ? sectionsByYear[2].length : 0) + 1}`,
                  labRoom: 'Software Lab',
                  mentorFacultyId: faculty[0] ? faculty[0].id : '',
                });
                setShowModal(true);
              }}
              className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm shadow-indigo-200 flex items-center space-x-1.5 transition"
            >
              <Icons.Plus className="w-4 h-4" />
              <span>Add New Section</span>
            </button>
          </div>

          {[1, 2, 3, 4].map((year) => {
            const yearSecs = sectionsByYear[year] || [];
            const yearSubjects = subjects.filter((s) => s.year === year);

            return (
              <div key={year} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center space-x-3">
                    <span className="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-700 font-bold flex items-center justify-center text-sm border border-indigo-100">
                      {year}
                    </span>
                    <div>
                      <h3 className="font-bold text-slate-900 text-base">
                        {year === 1 ? '1st Year' : year === 2 ? '2nd Year' : year === 3 ? '3rd Year' : '4th Year'} Classes
                      </h3>
                      <p className="text-xs text-slate-500">{yearSubjects.length} Active Courses in Curriculum</p>
                    </div>
                  </div>

                  <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700">
                    {yearSecs.length} {yearSecs.length === 1 ? 'Section' : 'Sections'}
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {yearSecs.map((sec) => {
                    const mentor = faculty.find((f) => f.id === sec.mentorFacultyId);

                    return (
                      <div
                        key={sec.id}
                        className="bg-slate-50/70 p-4 rounded-xl border border-slate-200 flex flex-col justify-between hover:border-indigo-300 transition"
                      >
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="font-bold text-slate-900 text-base">{sec.name}</span>
                            <button
                              onClick={() => handleDeleteSection(sec.id, `${year}Yr - ${sec.name}`)}
                              className="text-slate-400 hover:text-rose-600 transition"
                              title="Delete section"
                            >
                              <Icons.Trash2 className="w-4 h-4" />
                            </button>
                          </div>

                          <div className="space-y-2 text-xs">
                            <div className="flex items-center justify-between text-slate-600">
                              <span className="text-slate-400">Classroom:</span>
                              <span className="font-medium font-mono">{sec.roomNumber || 'Room N/A'}</span>
                            </div>
                            <div className="flex items-center justify-between text-slate-600">
                              <span className="text-slate-400">Assigned Lab:</span>
                              <span className="font-medium">{sec.labRoom || 'Default Lab'}</span>
                            </div>
                            <div className="pt-2 border-t border-slate-200/60 flex items-center justify-between">
                              <span className="text-slate-400">Class Mentor:</span>
                              <span className="font-semibold text-indigo-700">
                                {mentor ? mentor.name : 'Unassigned'}
                              </span>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* Add Section Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 animate-in fade-in zoom-in duration-150">
                <div className="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                  <h3 className="text-lg font-bold text-slate-900">Add New Class Section</h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600 text-xl">
                    &times;
                  </button>
                </div>

                <form onSubmit={handleAddSection} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Academic Year</label>
                      <select
                        value={formData.year}
                        onChange={(e) => setFormData({ ...formData, year: Number(e.target.value) })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white"
                      >
                        <option value={1}>1st Year</option>
                        <option value={2}>2nd Year</option>
                        <option value={3}>3rd Year</option>
                        <option value={4}>4th Year</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Section Name</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Section C"
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Theory Classroom</label>
                      <input
                        type="text"
                        placeholder="e.g. LH-203"
                        value={formData.roomNumber}
                        onChange={(e) => setFormData({ ...formData, roomNumber: e.target.value })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Dedicated Lab Venue</label>
                      <input
                        type="text"
                        placeholder="e.g. Computing Lab 2"
                        value={formData.labRoom}
                        onChange={(e) => setFormData({ ...formData, labRoom: e.target.value })}
                        className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Class Mentor / Tutor</label>
                    <select
                      value={formData.mentorFacultyId}
                      onChange={(e) => setFormData({ ...formData, mentorFacultyId: e.target.value })}
                      className="w-full text-sm px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white"
                    >
                      <option value="">Select Mentor Faculty</option>
                      {faculty.map((f) => (
                        <option key={f.id} value={f.id}>
                          {f.name} ({f.department})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md shadow-indigo-100 transition"
                    >
                      Create Section
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 4: Faculty Allocation & Real-Time Workload Meter
    // -------------------------------------------------------------
    function AllocationStep({ sections, subjects, faculty, allocations, setAllocations, facultyWorkloads, showToast }) {
      const [activeSectionId, setActiveSectionId] = useState(sections[0] ? sections[0].id : '');
      const [draggedFacultyId, setDraggedFacultyId] = useState(null);
      const [dragOverSubjectId, setDragOverSubjectId] = useState(null);

      const currentSection = useMemo(() => {
        return sections.find((s) => s.id === activeSectionId) || sections[0];
      }, [sections, activeSectionId]);

      const sectionSubjects = useMemo(() => {
        if (!currentSection) return [];
        return subjects.filter((s) => s.year === currentSection.year);
      }, [subjects, currentSection]);

      const handleTheoryFacultyChange = (subjectId, facultyId) => {
        setAllocations((prev) => {
          const exists = prev.find((a) => a.sectionId === activeSectionId && a.subjectId === subjectId);
          if (exists) {
            return prev.map((a) =>
              a.sectionId === activeSectionId && a.subjectId === subjectId
                ? { ...a, facultyIds: facultyId ? [facultyId] : [] }
                : a
            );
          } else {
            return [...prev, { sectionId: activeSectionId, subjectId, facultyIds: facultyId ? [facultyId] : [] }];
          }
        });
      };

      const handleLabFacultyToggle = (subjectId, facultyId) => {
        setAllocations((prev) => {
          const exists = prev.find((a) => a.sectionId === activeSectionId && a.subjectId === subjectId);
          let currentIds = exists ? [...(exists.facultyIds || [])] : [];

          if (currentIds.includes(facultyId)) {
            currentIds = currentIds.filter((id) => id !== facultyId);
          } else {
            currentIds.push(facultyId);
          }

          if (exists) {
            return prev.map((a) =>
              a.sectionId === activeSectionId && a.subjectId === subjectId ? { ...a, facultyIds: currentIds } : a
            );
          } else {
            return [...prev, { sectionId: activeSectionId, subjectId, facultyIds: currentIds }];
          }
        });
      };

      const handleAutoAssign = () => {
        let assignedCount = 0;
        setAllocations((prev) => {
          const updated = [...prev];
          sectionSubjects.forEach((sub) => {
            const existing = updated.find((a) => a.sectionId === activeSectionId && a.subjectId === sub.id);
            if (!existing || !existing.facultyIds || existing.facultyIds.length === 0) {
              const eligible = faculty
                .filter((f) => f.department === sub.department || f.department === 'CSE')
                .sort((a, b) => {
                  const loadA = facultyWorkloads[a.id] ? facultyWorkloads[a.id].totalAssigned : 0;
                  const loadB = facultyWorkloads[b.id] ? facultyWorkloads[b.id].totalAssigned : 0;
                  return loadA - loadB;
                });

              if (eligible.length > 0) {
                const picked = sub.isLab && eligible.length > 1 ? [eligible[0].id, eligible[1].id] : [eligible[0].id];
                if (existing) {
                  existing.facultyIds = picked;
                } else {
                  updated.push({ sectionId: activeSectionId, subjectId: sub.id, facultyIds: picked });
                }
                assignedCount++;
              }
            }
          });
          return updated;
        });

        showToast(`Auto-assigned faculty to ${assignedCount} courses in ${currentSection ? currentSection.name : ''}!`, 'success');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Icons.Share2 className="w-6 h-6 text-indigo-600" />
                Faculty-to-Subject & Lab Allocation Matrix
              </h2>
              <p className="text-sm text-slate-500 mt-1">
                Map faculty to theory courses and assign multi-faculty lab teams. Live meter displays <strong>internal + other-department locked hours</strong>.
              </p>
            </div>

            <button
              onClick={handleAutoAssign}
              className="px-4 py-2 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-xl border border-indigo-200 flex items-center space-x-1.5 transition"
            >
              <Icons.Sparkles className="w-4 h-4 text-indigo-600" />
              <span>Smart Auto-Assign Faculty</span>
            </button>
          </div>

          {/* Section Picker Tabs */}
          <div className="flex items-center space-x-2 overflow-x-auto pb-2">
            {sections.map((sec) => (
              <button
                key={sec.id}
                onClick={() => setActiveSectionId(sec.id)}
                className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                  activeSectionId === sec.id
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100'
                    : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'
                }`}
              >
                {sec.year === 1 ? '1st' : sec.year === 2 ? '2nd' : sec.year === 3 ? '3rd' : '4th'} Yr - {sec.name}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Subject Allocation Cards */}
            <div className="lg:col-span-2 space-y-4">
              {sectionSubjects.map((sub) => {
                const alloc = allocations.find((a) => a.sectionId === activeSectionId && a.subjectId === sub.id);
                const assignedFacultyIds = alloc ? alloc.facultyIds || [] : [];

                return (
                  <div
                    key={sub.id}
                    onDragOver={(e) => {
                      e.preventDefault();
                      setDragOverSubjectId(sub.id);
                    }}
                    onDragLeave={() => {
                      if (dragOverSubjectId === sub.id) setDragOverSubjectId(null);
                    }}
                    onDrop={(e) => {
                      e.preventDefault();
                      setDragOverSubjectId(null);
                      const facultyId = e.dataTransfer.getData('text/plain') || draggedFacultyId;
                      if (!facultyId) return;
                      const facObj = faculty.find((f) => f.id === facultyId);
                      if (!sub.isLab) {
                        handleTheoryFacultyChange(sub.id, facultyId);
                        showToast(`Assigned ${facObj?.name || 'Faculty'} to ${sub.code} (${sub.name})`, 'success');
                      } else {
                        handleLabFacultyToggle(sub.id, facultyId);
                        showToast(`Updated lab team for ${sub.code} with ${facObj?.name || 'Faculty'}`, 'success');
                      }
                    }}
                    className={`bg-white p-5 rounded-2xl border transition space-y-4 ${
                      dragOverSubjectId === sub.id
                        ? 'border-indigo-500 ring-2 ring-indigo-400 bg-indigo-50/40 shadow-md'
                        : 'border-slate-200 hover:border-indigo-200 shadow-sm'
                    }`}
                  >
                    <div className="flex items-start justify-between">
                      <div>
                        <div className="flex items-center space-x-2 mb-1">
                          <span className="font-mono text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-800">
                            {sub.code}
                          </span>
                          <span
                            className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                              sub.isLab ? 'bg-fuchsia-50 text-fuchsia-700' : 'bg-blue-50 text-blue-700'
                            }`}
                          >
                            {sub.isLab ? 'LABORATORY' : 'THEORY'}
                          </span>
                          <span className="text-xs text-slate-400">({sub.department})</span>
                        </div>
                        <h4 className="font-bold text-slate-900 text-base">{sub.name}</h4>
                      </div>

                      <div className="text-right">
                        <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100">
                          {sub.isLab ? `${sub.labHoursPerWeek} hrs Lab block` : `${sub.theoryHoursPerWeek} hrs/wk`}
                        </span>
                      </div>
                    </div>

                    {draggedFacultyId && (
                      <div className="py-1.5 px-3 border border-dashed border-indigo-300 bg-indigo-50/60 rounded-xl text-center text-xs font-semibold text-indigo-700 animate-pulse">
                        📥 Drag & Drop target: Drop faculty here to assign to {sub.code}
                      </div>
                    )}

                    <div>
                      {!sub.isLab ? (
                        <div>
                          <label className="block text-xs font-semibold text-slate-500 mb-1.5">
                            Assigned Theory Instructor (Drag from right or select dropdown):
                          </label>
                          <select
                            value={assignedFacultyIds[0] || ''}
                            onChange={(e) => handleTheoryFacultyChange(sub.id, e.target.value)}
                            className="w-full text-sm px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50/50"
                          >
                            <option value="">-- Unassigned (Select Faculty or Drag & Drop) --</option>
                            {faculty.map((f) => {
                              const load = facultyWorkloads[f.id] || { totalAssigned: 0, maxWorkload: f.maxWorkloadHours, externalHours: 0 };
                              return (
                                <option key={f.id} value={f.id}>
                                  {f.name} ({f.department}) &bull; Load: {load.totalAssigned}/{load.maxWorkload}h {load.externalHours > 0 ? `(includes ${load.externalHours}h other-dept)` : ''}
                                </option>
                              );
                            })}
                          </select>
                        </div>
                      ) : (
                        <div>
                          <label className="block text-xs font-semibold text-slate-500 mb-1.5">
                            Assigned Lab Instructors (Drag from right or toggle buttons):
                          </label>
                          <div className="flex flex-wrap gap-2">
                            {faculty.map((f) => {
                              const isSelected = assignedFacultyIds.includes(f.id);
                              const load = facultyWorkloads[f.id] || { totalAssigned: 0, maxWorkload: f.maxWorkloadHours, externalHours: 0 };

                              return (
                                <button
                                  key={f.id}
                                  type="button"
                                  onClick={() => handleLabFacultyToggle(sub.id, f.id)}
                                  className={`px-3 py-1.5 rounded-xl text-xs font-medium border flex items-center space-x-1.5 transition ${
                                    isSelected
                                      ? 'bg-fuchsia-600 text-white border-fuchsia-600 shadow-sm'
                                      : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                                  }`}
                                >
                                  <span>{f.name}</span>
                                  <span className={`text-[10px] ${isSelected ? 'text-fuchsia-200' : 'text-slate-400'}`}>
                                    ({load.totalAssigned}/{load.maxWorkload}h)
                                  </span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Sticky Real-Time Workload Meter */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm h-fit sticky top-24 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <div>
                  <h3 className="font-bold text-slate-900 text-sm flex items-center gap-1.5">
                    <Icons.Users className="w-4 h-4 text-indigo-600" />
                    Live Workload Meter
                  </h3>
                  <p className="text-[10px] text-slate-400 mt-0.5">Drag any faculty card to assign</p>
                </div>
                <span className="text-[11px] font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">
                  Drag & Drop
                </span>
              </div>

              <div className="space-y-3 max-h-[580px] overflow-y-auto pr-1">
                {faculty.map((f) => {
                  const load = facultyWorkloads[f.id] || { totalAssigned: 0, maxWorkload: f.maxWorkloadHours, externalHours: 0 };
                  const pct = Math.min(Math.round((load.totalAssigned / load.maxWorkload) * 100), 100);
                  const isOver = load.totalAssigned > load.maxWorkload;

                  return (
                    <div
                      key={f.id}
                      draggable={true}
                      onDragStart={(e) => {
                        e.dataTransfer.setData('text/plain', f.id);
                        setDraggedFacultyId(f.id);
                      }}
                      onDragEnd={() => setDraggedFacultyId(null)}
                      className={`p-2.5 rounded-xl border transition space-y-1.5 cursor-grab active:cursor-grabbing select-none ${
                        draggedFacultyId === f.id
                          ? 'bg-indigo-100 border-indigo-400 scale-[1.02] shadow-sm'
                          : 'bg-slate-50/80 hover:bg-indigo-50/60 border-slate-200/90 hover:border-indigo-300'
                      }`}
                      title={`Drag ${f.name} to drop onto any course card on the left`}
                    >
                      <div className="flex justify-between items-center text-xs">
                        <div className="flex items-center space-x-1.5 truncate">
                          <span className="text-slate-400 text-[10px]">⠿</span>
                          <span className="font-semibold text-slate-800 truncate max-w-[120px]">{f.name}</span>
                        </div>
                        <div className="text-right">
                          <span className={`font-mono text-[11px] font-bold ${isOver ? 'text-rose-600' : 'text-slate-700'}`}>
                            {load.totalAssigned} / {load.maxWorkload} hrs
                          </span>
                          {load.externalHours > 0 && (
                            <span className="block text-[9px] text-amber-700 font-bold">
                              {load.externalHours}h in other depts
                            </span>
                          )}
                        </div>
                      </div>
                      <div className="w-full bg-slate-200/70 rounded-full h-1.5 overflow-hidden">
                        <div
                          className={`h-1.5 rounded-full transition-all ${
                            isOver ? 'bg-rose-500' : pct >= 85 ? 'bg-amber-500' : 'bg-emerald-500'
                          }`}
                          style={{ width: `${pct}%` }}
                        ></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 5: Schedule Rules, Saturday P5 Disabling & Prefixing
    // -------------------------------------------------------------
    function TimetableConfigAndPrefixStep({
      sections,
      subjects,
      faculty,
      prefixedSlots,
      setPrefixedSlots,
      scheduleConfig,
      setScheduleConfig,
      allocations,
      setAllocations,
      tallyReport,
      onAutoBalanceAll,
      showToast,
    }) {
      const [targetSection, setTargetSection] = useState(sections[0]?.id || 'sec-2a');
      const [showPrefixModal, setShowPrefixModal] = useState(false);
      const [showLockedSlotModal, setShowLockedSlotModal] = useState(false);
      const [showPrefixManagerModal, setShowPrefixManagerModal] = useState(false);
      const [managerCategory, setManagerCategory] = useState('ALL'); // 'ALL' | 'LAB' | 'THEORY' | 'INSTITUTIONAL'
      const [selectedLockedSlot, setSelectedLockedSlot] = useState(null);
      const [selectedSlotCoord, setSelectedSlotCoord] = useState({ day: 'Monday', periodNumber: 1 });
      const [prefixMode, setPrefixMode] = useState('TYPE_A'); // 'TYPE_A' (Theory) | 'TYPE_B' (Lab) | 'TYPE_C' (Institutional)
      const [academicForm, setAcademicForm] = useState({
        subjectId: '',
        duration: 1,
        facultyId: '',
      });
      const [institutionalForm, setInstitutionalForm] = useState({
        label: 'Unit Test / Assessment',
        facultyId: '',
        duration: 1,
      });

      // Target section resolution (never null/undefined)
      const activeSectionId = useMemo(() => {
        if (targetSection && targetSection !== 'ALL') return targetSection;
        return sections[0]?.id || 'sec-2a';
      }, [targetSection, sections]);

      const activeSectionObj = useMemo(() => {
        return sections.find((s) => s.id === activeSectionId) || sections[0] || null;
      }, [sections, activeSectionId]);

      // Comprehensive subjects list for the active section:
      // Includes all subjects mapped in allocations + all subjects matching this section's academic year!
      // This guarantees that subjects like "Data Structures" or newly added subjects are ALWAYS available!
      const activeSectionSubjects = useMemo(() => {
        if (!activeSectionObj) return [];
        const secAllocs = allocations.filter((a) => a.sectionId === activeSectionObj.id);
        const allocatedSubIds = new Set(secAllocs.map((a) => a.subjectId));

        // Find all subjects belonging to this section's year or allocated to it
        const candidateSubs = subjects.filter(
          (s) => s.year === activeSectionObj.year || allocatedSubIds.has(s.id)
        );

        return candidateSubs.map((sub) => {
          const alloc = secAllocs.find((a) => a.subjectId === sub.id);
          const fIds = alloc ? alloc.facultyIds || [] : [];
          const facNames = fIds.map((fId) => faculty.find((f) => f.id === fId)?.name || fId);
          const isLab = Boolean(sub.isLab || sub.labHoursPerWeek > 0);
          const totalHours = sub ? (isLab ? Number(sub.labHoursPerWeek) || 3 : Number(sub.theoryHoursPerWeek) || 4) : 0;

          // Count already-prefixed hours for this subject in this section
          const prefixedCount = prefixedSlots.filter(
            (s) => (s.sectionId === activeSectionObj.id || s.sectionId === 'ALL') && s.subjectId === sub.id
          ).length;

          return {
            allocation: alloc,
            subject: sub,
            isLab,
            totalHours,
            prefixedCount,
            remainingHours: Math.max(0, totalHours - prefixedCount),
            facultyIds: fIds,
            facultyNames,
          };
        });
      }, [activeSectionObj, allocations, subjects, faculty, prefixedSlots]);

      const theorySectionSubjects = useMemo(() => {
        return activeSectionSubjects.filter((s) => !s.isLab);
      }, [activeSectionSubjects]);

      const labSectionSubjects = useMemo(() => {
        return activeSectionSubjects.filter((s) => s.isLab);
      }, [activeSectionSubjects]);

      // Smart helper to find the first clash-free slot that respects Saturday P5 & lunch break
      const findFirstAvailableSlot = (secId, duration = 1, preferredPeriod = null) => {
        const days = scheduleConfig.days;
        const lunchPeriod = scheduleConfig.lunchBreak.afterPeriod;

        // 1. If preferred period is given, scan days for it
        if (preferredPeriod !== null) {
          for (const d of days) {
            let free = true;
            for (let offset = 0; offset < duration; offset++) {
              const p = preferredPeriod + offset;
              if (p > scheduleConfig.periods.length) { free = false; break; }
              if (window.TimetableCore.TallyEngine.isSlotDisabled(d, p, scheduleConfig)) { free = false; break; }
              if (duration > 1 && preferredPeriod <= lunchPeriod && p > lunchPeriod) { free = false; break; }
              const occ = prefixedSlots.some(
                (s) => (s.sectionId === secId || s.sectionId === 'ALL') && s.day === d && s.periodNumber === p
              );
              if (occ) { free = false; break; }
            }
            if (free) return { day: d, periodNumber: preferredPeriod };
          }
        }

        // 2. Scan all days and periods
        for (const d of days) {
          for (const period of scheduleConfig.periods) {
            const pNum = period.id;
            let free = true;
            for (let offset = 0; offset < duration; offset++) {
              const p = pNum + offset;
              if (p > scheduleConfig.periods.length) { free = false; break; }
              if (window.TimetableCore.TallyEngine.isSlotDisabled(d, p, scheduleConfig)) { free = false; break; }
              if (duration > 1 && pNum <= lunchPeriod && p > lunchPeriod) { free = false; break; }
              const occ = prefixedSlots.some(
                (s) => (s.sectionId === secId || s.sectionId === 'ALL') && s.day === d && s.periodNumber === p
              );
              if (occ) { free = false; break; }
            }
            if (free) return { day: d, periodNumber: pNum };
          }
        }

        return { day: 'Monday', periodNumber: 1 };
      };

      // Open prefix manager modal directly from any column header, cell, or button
      const openPrefixManager = (category = 'ALL', sectionId = null) => {
        if (sectionId) {
          setTargetSection(sectionId);
        }
        setManagerCategory(category);
        setShowPrefixManagerModal(true);
      };

      // Auto-prefix labs handler (All Sections or Current Section)
      const handleAutoPrefixLabs = (scope = 'ALL') => {
        const secToPrefix = scope === 'ALL' ? 'ALL' : targetSection;
        const result = window.TimetableCore.PrefixEngine.autoPrefixLabs({
          sectionId: secToPrefix,
          sections,
          subjects,
          allocations,
          prefixedSlots,
          scheduleConfig,
          facultyList: faculty,
        });

        if (result.totalPrefixedCount === 0) {
          showToast('All lab hours for this selection are already fully prefixed in continuous blocks!', 'info');
        } else {
          setPrefixedSlots(result.updatedSlots);
          showToast(
            `Successfully auto-prefixed ${result.totalPrefixedCount} continuous lab periods across ${
              scope === 'ALL' ? 'all college sections' : 'the active section'
            }! Zero clashes detected.`,
            'success'
          );
        }
      };

      const handleSlotClick = (day, periodNumber) => {
        // Check if slot is disabled (Saturday Period 5)
        if (window.TimetableCore.TallyEngine.isSlotDisabled(day, periodNumber, scheduleConfig)) {
          showToast(`Action Blocked: ${day} Period ${periodNumber} is strictly disabled by academic schedule rules.`, 'warning');
          return;
        }

        const existing = prefixedSlots.find(
          (s) => (s.sectionId === targetSection || s.sectionId === 'ALL') && s.day === day && s.periodNumber === periodNumber
        );

        if (existing) {
          // Open in-app locked slot action modal (reliable across all browsers)
          setSelectedLockedSlot(existing);
          setSelectedSlotCoord({ day, periodNumber });
          setShowLockedSlotModal(true);
        } else {
          setSelectedSlotCoord({ day, periodNumber });
          if (targetSection === 'ALL') {
            setPrefixMode('TYPE_C');
            setInstitutionalForm({
              label: 'Unit Test / Assessment',
              facultyId: '',
              duration: 1,
            });
          } else {
            // Intelligent mode default:
            // If starting at standard lab period (e.g. Period 1 or Period 5) and lab hours remain -> TYPE_B
            const lunchPeriod = scheduleConfig.lunchBreak.afterPeriod;
            const isStandardLabStart = (periodNumber === 1 || periodNumber === lunchPeriod + 1);
            const pendingLab = labSectionSubjects.find((l) => l.remainingHours > 0);
            const pendingTheory = theorySectionSubjects.find((t) => t.remainingHours > 0) || theorySectionSubjects[0];

            if (isStandardLabStart && pendingLab) {
              setPrefixMode('TYPE_B');
              setAcademicForm({
                subjectId: pendingLab.subject.id,
                duration: pendingLab.totalHours || 3,
                facultyId: pendingLab.facultyIds?.[0] || '',
              });
            } else {
              setPrefixMode('TYPE_A');
              setAcademicForm({
                subjectId: pendingTheory?.subject?.id || '',
                duration: 1,
                facultyId: pendingTheory?.facultyIds?.[0] || '',
              });
            }
          }
          setShowPrefixModal(true);
        }
      };

      const handleUnlockSlot = (slotToRemove) => {
        if (!slotToRemove) return;
        setPrefixedSlots((prev) => prev.filter((s) => s.id !== slotToRemove.id));
        showToast(`Unlocked slot "${slotToRemove.label}" on ${slotToRemove.day} Period ${slotToRemove.periodNumber}`, 'info');
        setShowLockedSlotModal(false);
      };

      // Unlocks all slots belonging to a continuous block
      const handleUnlockBlock = (slotsToRemove) => {
        if (!slotsToRemove || slotsToRemove.length === 0) return;
        const idsToRemove = new Set(slotsToRemove.map((s) => s.id));
        setPrefixedSlots((prev) => prev.filter((s) => !idsToRemove.has(s.id)));
        const first = slotsToRemove[0];
        showToast(`Unlocked ${slotsToRemove.length} periods for "${first.label}" on ${first.day}`, 'info');
      };

      // Unlocks all slots in the current category for target section
      const handleClearCategoryLocks = (category = managerCategory) => {
        setPrefixedSlots((prev) => {
          return prev.filter((s) => {
            const secMatch = targetSection === 'ALL' ? true : (s.sectionId === targetSection);
            if (!secMatch) return true; // keep other sections
            if (category === 'LAB' && (s.isLab || s.label?.toLowerCase().includes('lab'))) return false;
            if (category === 'THEORY' && ((s.type === 'ACADEMIC' || s.subjectId) && !s.isLab && !s.label?.toLowerCase().includes('lab'))) return false;
            if (category === 'INSTITUTIONAL' && (s.type === 'NON_ACADEMIC' || (!s.subjectId && !s.isLab))) return false;
            if (category === 'ALL') return false;
            return true;
          });
        });
        showToast(`Cleared locked slots for ${sections.find((s) => s.id === targetSection)?.name || 'selection'}.`, 'info');
      };

      const handleReplaceSlot = (slotToReplace) => {
        setShowLockedSlotModal(false);
        setPrefixedSlots((prev) => prev.filter((s) => s.id !== slotToReplace.id));
        setSelectedSlotCoord({ day: slotToReplace.day, periodNumber: slotToReplace.periodNumber });
        if (slotToReplace.subjectId) {
          const isLab = Boolean(slotToReplace.isLab);
          setPrefixMode(isLab ? 'TYPE_B' : 'TYPE_A');
          setAcademicForm({
            subjectId: slotToReplace.subjectId,
            duration: slotToReplace.duration || 1,
            facultyId: slotToReplace.facultyIds?.[0] || '',
          });
        } else {
          setPrefixMode('TYPE_C');
          setInstitutionalForm({
            label: slotToReplace.label || 'Unit Test / Assessment',
            facultyId: slotToReplace.facultyId || '',
            duration: slotToReplace.duration || 1,
          });
        }
        setShowPrefixModal(true);
      };

      const handleQuickPrefixSubject = (subItem, preferredSecId = null) => {
        const activeSec = preferredSecId || targetSection;
        const validSecId = activeSec === 'ALL' ? (sections[0]?.id || '') : activeSec;
        setTargetSection(validSecId);

        const subObj = subItem.subject || subItem;
        const isLab = Boolean(subItem.isLab || subObj.isLab || subObj.labHoursPerWeek > 0);
        const duration = isLab ? (subObj.labHoursPerWeek || 3) : 1;

        setPrefixMode(isLab ? 'TYPE_B' : 'TYPE_A');
        setAcademicForm({
          subjectId: subObj.id,
          duration,
          facultyId: subItem.facultyIds?.[0] || '',
        });

        const freeCoord = findFirstAvailableSlot(validSecId, duration);
        setSelectedSlotCoord(freeCoord);
        setShowPrefixModal(true);
      };

      const handleSavePrefix = (e) => {
        e.preventDefault();
        const duration = (prefixMode === 'TYPE_A' || prefixMode === 'TYPE_B')
          ? (Number(academicForm.duration) || 1)
          : (Number(institutionalForm.duration) || 1);

        const newSlotsToAdd = [];
        const secIdToLock = (prefixMode === 'TYPE_C' && targetSection === 'ALL')
          ? 'ALL'
          : (targetSection === 'ALL' ? (sections[0]?.id || 'sec-1a') : targetSection);

        const lunchPeriod = scheduleConfig.lunchBreak.afterPeriod;

        // 1. Validate boundary limits
        if (selectedSlotCoord.periodNumber + duration - 1 > scheduleConfig.periods.length) {
          showToast(`Cannot lock ${duration} periods starting at Period ${selectedSlotCoord.periodNumber}: exceeds daily periods limit (${scheduleConfig.periods.length}).`, 'rose');
          return;
        }

        // 2. Validate continuous multi-hour block does not bridge lunch break
        if (duration > 1 && selectedSlotCoord.periodNumber <= lunchPeriod && (selectedSlotCoord.periodNumber + duration - 1) > lunchPeriod) {
          showToast(`Rule Violation: Continuous block cannot bridge over the Lunch Break (between Period ${lunchPeriod} and Period ${lunchPeriod + 1}).`, 'rose');
          return;
        }

        // 3. Validate each period in continuous block for disabled & existing occupancy
        for (let offset = 0; offset < duration; offset++) {
          const p = selectedSlotCoord.periodNumber + offset;

          if (window.TimetableCore.TallyEngine.isSlotDisabled(selectedSlotCoord.day, p, scheduleConfig)) {
            showToast(`Cannot lock: ${selectedSlotCoord.day} Period ${p} is strictly disabled / unallocatable.`, 'rose');
            return;
          }

          const already = prefixedSlots.find(
            (s) => (s.sectionId === secIdToLock || s.sectionId === 'ALL') && s.day === selectedSlotCoord.day && s.periodNumber === p
          );
          if (already) {
            showToast(`Conflict: ${selectedSlotCoord.day} Period ${p} is already locked as "${already.label}".`, 'warning');
            return;
          }
        }

        if (prefixMode === 'TYPE_A' || prefixMode === 'TYPE_B') {
          const sub = subjects.find((s) => s.id === academicForm.subjectId);
          if (!sub) {
            showToast('Please select a valid subject.', 'warning');
            return;
          }

          const isLab = prefixMode === 'TYPE_B' || Boolean(sub.isLab || sub.labHoursPerWeek > 0);
          const alloc = allocations.find((a) => a.sectionId === secIdToLock && a.subjectId === sub.id);
          const chosenFacultyId = academicForm.facultyId;
          const finalFacultyIds = chosenFacultyId
            ? [chosenFacultyId]
            : (alloc && alloc.facultyIds && alloc.facultyIds.length > 0 ? alloc.facultyIds : []);

          // 4. Zero Faculty Clash Check across ALL other sections and external loads!
          if (finalFacultyIds.length > 0) {
            for (let offset = 0; offset < duration; offset++) {
              const p = selectedSlotCoord.periodNumber + offset;
              for (const fId of finalFacultyIds) {
                const facObj = faculty.find((f) => f.id === fId);
                const facName = facObj ? facObj.name : 'Faculty';

                // Check external locked loads
                if (facObj && facObj.externalLoads) {
                  const extClash = facObj.externalLoads.find(
                    (ext) => ext.day === selectedSlotCoord.day && ext.period === p
                  );
                  if (extClash) {
                    showToast(`Faculty Clash: ${facName} has locked load in ${extClash.department} dept on ${selectedSlotCoord.day} Period ${p}!`, 'rose');
                    return;
                  }
                }

                // Check other sections' prefixed slots
                const otherClash = prefixedSlots.find(
                  (s) => s.sectionId !== secIdToLock &&
                         s.sectionId !== 'ALL' &&
                         s.day === selectedSlotCoord.day &&
                         s.periodNumber === p &&
                         s.facultyIds && s.facultyIds.includes(fId)
                );
                if (otherClash) {
                  const otherSecName = sections.find((s) => s.id === otherClash.sectionId)?.name || otherClash.sectionId;
                  showToast(`Faculty Clash: ${facName} is already locked for ${otherSecName} on ${selectedSlotCoord.day} Period ${p}!`, 'rose');
                  return;
                }
              }
            }
          }

          for (let offset = 0; offset < duration; offset++) {
            const p = selectedSlotCoord.periodNumber + offset;
            newSlotsToAdd.push({
              id: 'pre-' + Math.random().toString(36).substring(2, 9),
              sectionId: secIdToLock,
              day: selectedSlotCoord.day,
              periodNumber: p,
              type: 'ACADEMIC',
              isLab,
              subjectId: sub.id,
              label: isLab ? `${sub.code} Lab` : sub.name,
              facultyIds: finalFacultyIds,
              duration,
              blockStartPeriod: selectedSlotCoord.periodNumber,
              blockIndex: offset + 1,
              isLocked: true,
            });
          }

          setPrefixedSlots((prev) => [...prev, ...newSlotsToAdd]);

          // Automatically sync allocation so faculty mapping is permanently linked
          if (setAllocations && secIdToLock !== 'ALL') {
            setAllocations((prev) => {
              const idx = prev.findIndex((a) => a.sectionId === secIdToLock && a.subjectId === sub.id);
              if (idx >= 0) {
                if (finalFacultyIds.length > 0 && JSON.stringify(prev[idx].facultyIds) !== JSON.stringify(finalFacultyIds)) {
                  const updated = [...prev];
                  updated[idx] = { ...updated[idx], facultyIds: finalFacultyIds };
                  return updated;
                }
                return prev;
              } else {
                return [
                  ...prev,
                  {
                    id: `alloc-${secIdToLock}-${sub.id}`,
                    sectionId: secIdToLock,
                    subjectId: sub.id,
                    facultyIds: finalFacultyIds,
                  },
                ];
              }
            });
          }

          showToast(`Locked ${duration} period(s) for ${sub.code} on ${selectedSlotCoord.day} Period(s) ${selectedSlotCoord.periodNumber}–${selectedSlotCoord.periodNumber + duration - 1}!`, 'success');
        } else {
          // TYPE_C: Institutional
          for (let offset = 0; offset < duration; offset++) {
            const p = selectedSlotCoord.periodNumber + offset;
            newSlotsToAdd.push({
              id: 'pre-' + Math.random().toString(36).substring(2, 9),
              sectionId: secIdToLock,
              day: selectedSlotCoord.day,
              periodNumber: p,
              type: 'NON_ACADEMIC',
              label: institutionalForm.label,
              subjectId: null,
              facultyId: institutionalForm.facultyId || null,
              duration,
              isLocked: true,
            });
          }
          setPrefixedSlots((prev) => [...prev, ...newSlotsToAdd]);
          showToast(`Locked ${institutionalForm.label} on ${selectedSlotCoord.day} Period ${selectedSlotCoord.periodNumber}`, 'success');
        }

        setShowPrefixModal(false);
      };

      // Filtered slots for Prefix Manager Modal
      const managerFilteredSlots = useMemo(() => {
        return prefixedSlots.filter((s) => {
          const secMatch = targetSection === 'ALL' ? true : (s.sectionId === targetSection || s.sectionId === 'ALL');
          if (!secMatch) return false;
          if (managerCategory === 'LAB') return s.isLab || s.label?.toLowerCase().includes('lab');
          if (managerCategory === 'THEORY') return (s.type === 'ACADEMIC' || s.subjectId) && !s.isLab && !s.label?.toLowerCase().includes('lab');
          if (managerCategory === 'INSTITUTIONAL') return s.type === 'NON_ACADEMIC' || (!s.subjectId && !s.isLab);
          return true;
        });
      }, [prefixedSlots, targetSection, managerCategory]);

      // Group manager slots by continuous blocks for clean display
      const groupedManagerBlocks = useMemo(() => {
        const groups = [];
        const visitedIds = new Set();

        managerFilteredSlots.forEach((slot) => {
          if (visitedIds.has(slot.id)) return;

          // Find contiguous sibling slots with same section, day, and subject/label
          const siblings = managerFilteredSlots.filter(
            (other) =>
              other.sectionId === slot.sectionId &&
              other.day === slot.day &&
              (other.subjectId ? other.subjectId === slot.subjectId : other.label === slot.label)
          ).sort((a, b) => a.periodNumber - b.periodNumber);

          // Verify if siblings form a continuous contiguous period block
          let isContiguous = true;
          for (let i = 0; i < siblings.length - 1; i++) {
            if (siblings[i + 1].periodNumber !== siblings[i].periodNumber + 1) {
              isContiguous = false;
              break;
            }
          }

          if (isContiguous && siblings.length > 1) {
            siblings.forEach((s) => visitedIds.add(s.id));
            groups.push({
              id: slot.id,
              isBlock: true,
              slots: siblings,
              sectionId: slot.sectionId,
              day: slot.day,
              startPeriod: siblings[0].periodNumber,
              endPeriod: siblings[siblings.length - 1].periodNumber,
              duration: siblings.length,
              label: slot.label,
              isLab: slot.isLab,
              type: slot.type,
              subjectId: slot.subjectId,
              facultyIds: slot.facultyIds || [],
            });
          } else {
            visitedIds.add(slot.id);
            groups.push({
              id: slot.id,
              isBlock: false,
              slots: [slot],
              sectionId: slot.sectionId,
              day: slot.day,
              startPeriod: slot.periodNumber,
              endPeriod: slot.periodNumber,
              duration: 1,
              label: slot.label,
              isLab: slot.isLab,
              type: slot.type,
              subjectId: slot.subjectId,
              facultyIds: slot.facultyIds || [],
            });
          }
        });

        return groups;
      }, [managerFilteredSlots]);

      // Category counts for manager tabs
      const categoryCounts = useMemo(() => {
        const forSection = prefixedSlots.filter((s) => targetSection === 'ALL' ? true : (s.sectionId === targetSection || s.sectionId === 'ALL'));
        const lab = forSection.filter((s) => s.isLab || s.label?.toLowerCase().includes('lab')).length;
        const theory = forSection.filter((s) => (s.type === 'ACADEMIC' || s.subjectId) && !s.isLab && !s.label?.toLowerCase().includes('lab')).length;
        const inst = forSection.filter((s) => s.type === 'NON_ACADEMIC' || (!s.subjectId && !s.isLab)).length;
        return { all: forSection.length, lab, theory, inst };
      }, [prefixedSlots, targetSection]);

      return (
        <div className="space-y-6">
          {/* Header Card */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Icons.Lock className="w-6 h-6 text-indigo-600" />
                Schedule Grid, Day Rules & Prefixing (Pre-Allocation Engine)
              </h2>

                      Fixed ({categoryCounts.inst}h)
                    </button>
                  </div>

                  {/* Section Selector */}
                  <div className="flex items-center space-x-2">
                    <span className="text-xs text-slate-500 font-semibold whitespace-nowrap">Class:</span>
                    <select
                      value={targetSection}
                      onChange={(e) => setTargetSection(e.target.value)}
                      className="text-xs font-semibold border border-slate-200 rounded-xl px-2.5 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="ALL">All Sections (Global)</option>
                      {sections.map((s) => (
                        <option key={s.id} value={s.id}>
                          {s.year === 1 ? '1st' : s.year === 2 ? '2nd' : s.year === 3 ? '3rd' : '4th'} Yr - {s.name}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* Quick Action Buttons inside Manager */}
                <div className="flex flex-wrap items-center justify-between gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200/80 mb-4 flex-shrink-0">
                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      type="button"
                      onClick={() => handleAutoPrefixLabs('CURRENT')}
                      className="px-3 py-1.5 text-xs font-semibold text-white bg-pink-600 hover:bg-pink-700 rounded-xl shadow-xs flex items-center space-x-1.5 transition"
                      title="Auto-prefix all labs for the selected class in continuous clash-free blocks"
                    >
                      <Icons.Sparkles className="w-3.5 h-3.5" />
                      <span>Auto-Prefix Labs</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => {
                        const freeSlot = findFirstAvailableSlot(targetSection, managerCategory === 'LAB' ? 3 : 1);
                        setSelectedSlotCoord(freeSlot);
                        const firstSub = activeSectionSubjects.find((s) => {
                          if (managerCategory === 'LAB') return s.isLab && s.remainingHours > 0;
                          if (managerCategory === 'THEORY') return !s.isLab && s.remainingHours > 0;
                          return s.remainingHours > 0;
                        }) || activeSectionSubjects[0];

                        if (firstSub) {
                          setAcademicForm({
                            subjectId: firstSub.subject.id,
                            duration: firstSub.isLab ? (firstSub.subject.labHoursPerWeek || 3) : 1,
                            facultyId: firstSub.facultyIds?.[0] || '',
                          });
                        }
                        if (managerCategory === 'INSTITUTIONAL' || targetSection === 'ALL') {
                          setPrefixMode('TYPE_C');
                        } else if (managerCategory === 'LAB' || (firstSub && firstSub.isLab)) {
                          setPrefixMode('TYPE_B');
                        } else {
                          setPrefixMode('TYPE_A');
                        }
                        setShowPrefixModal(true);
                      }}
                      className="px-3 py-1.5 text-xs font-semibold text-indigo-700 bg-white hover:bg-indigo-50 border border-indigo-200 rounded-xl shadow-xs flex items-center space-x-1.5 transition"
                    >
                      <Icons.Plus className="w-3.5 h-3.5" />
                      <span>{managerCategory === 'LAB' ? '+ Prefix Lab Block' : managerCategory === 'THEORY' ? '+ Prefix Theory Hour' : '+ Prefix Slot'}</span>
                    </button>
                  </div>

                  {groupedManagerBlocks.length > 0 && (
                    <button
                      type="button"
                      onClick={() => handleClearCategoryLocks(managerCategory)}
                      className="px-2.5 py-1 text-[11px] font-semibold text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-lg transition flex items-center space-x-1"
                      title="Unlock all slots shown in this list"
                    >
                      <Icons.Trash className="w-3 h-3" />
                      <span>Clear {managerCategory === 'ALL' ? 'All' : managerCategory} Locks</span>
                    </button>
                  )}
                </div>

                {/* Prefixed Slots List */}
                <div className="flex-1 overflow-y-auto space-y-2.5 pr-1">
                  {groupedManagerBlocks.length === 0 ? (
                    <div className="text-center py-10 px-4 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50/50">
                      <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-400 mx-auto flex items-center justify-center mb-3">
                        <Icons.Lock className="w-6 h-6" />
                      </div>
                      <h4 className="font-bold text-slate-800 text-sm">
                        No {managerCategory === 'LAB' ? 'Lab Blocks' : managerCategory === 'THEORY' ? 'Theory Slots' : 'Prefixed Slots'} Found
                      </h4>
                      <p className="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
                        There are currently no locked {managerCategory.toLowerCase()} slots for this section selection.
                      </p>
                      <div className="mt-4 flex justify-center gap-2">
                        {managerCategory === 'LAB' && (
                          <button
                            type="button"
                            onClick={() => handleAutoPrefixLabs('CURRENT')}
                            className="px-3 py-1.5 text-xs font-semibold text-white bg-pink-600 hover:bg-pink-700 rounded-xl transition"
                          >
                            ⚡ Auto-Prefix Labs Now
                          </button>
                        )}
                        <button
                          type="button"
                          onClick={() => {
                            const freeSlot = findFirstAvailableSlot(targetSection, managerCategory === 'LAB' ? 3 : 1);
                            setSelectedSlotCoord(freeSlot);
                            setShowPrefixModal(true);
                          }}
                          className="px-3 py-1.5 text-xs font-semibold text-indigo-700 bg-white border border-indigo-200 hover:bg-indigo-50 rounded-xl transition"
                        >
                          + Manually Add Slot
                        </button>
                      </div>
                    </div>
                  ) : (
                    groupedManagerBlocks.map((item) => {
                      const secObj = sections.find((s) => s.id === item.sectionId);
                      const isLabBlock = item.isLab || item.label?.toLowerCase().includes('lab');
                      const facNames = (item.facultyIds || []).map((fId) => faculty.find((f) => f.id === fId)?.name || fId);

                      return (
                        <div
                          key={item.id + '-' + item.day + '-' + item.startPeriod}
                          className={`p-3.5 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition ${
                            isLabBlock ? 'bg-pink-50/50 border-pink-200' : item.type === 'ACADEMIC' || item.subjectId ? 'bg-indigo-50/40 border-indigo-200' : 'bg-slate-50 border-slate-200'
                          }`}
                        >
                          <div className="space-y-1">
                            <div className="flex items-center space-x-2">
                              <span
                                className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${
                                  isLabBlock
                                    ? 'bg-pink-600 text-white'
                                    : item.type === 'ACADEMIC' || item.subjectId
                                    ? 'bg-indigo-600 text-white'
                                    : 'bg-slate-600 text-white'
                                }`}
                              >
                                {isLabBlock ? `LAB BLOCK (${item.duration}h)` : item.type === 'ACADEMIC' || item.subjectId ? 'THEORY' : 'FIXED'}
                              </span>
                              <span className="text-xs font-bold text-slate-800">
                                {item.day} &bull; {item.duration > 1 ? `Periods ${item.startPeriod}–${item.endPeriod} (${item.duration} continuous periods)` : `Period ${item.startPeriod}`}
                              </span>
                            </div>

                            <h4 className="font-bold text-slate-900 text-sm">{item.label}</h4>

                            <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500">
                              <span>
                                Section: <strong className="text-slate-700">{item.sectionId === 'ALL' ? 'All Classes' : secObj?.name || item.sectionId}</strong>
                              </span>
                              {facNames.length > 0 && (
                                <span>
                                  Faculty: <strong className="text-slate-700">{facNames.join(', ')}</strong>
                                </span>
                              )}
                            </div>
                          </div>

                          <div className="flex items-center space-x-2 flex-shrink-0 self-end sm:self-center">
                            <button
                              type="button"
                              onClick={() => handleUnlockBlock(item.slots)}
                              className="px-3 py-1.5 text-xs font-semibold text-rose-700 hover:text-white bg-rose-50 hover:bg-rose-600 border border-rose-200 rounded-xl transition flex items-center space-x-1.5 shadow-xs"
                              title="Unlock this slot or continuous block"
                            >
                              <Icons.Trash className="w-3.5 h-3.5" />
                              <span>{item.duration > 1 ? 'Unlock Block' : 'Unlock'}</span>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                {/* Modal Footer */}
                <div className="flex justify-between items-center pt-4 border-t border-slate-100 mt-4 flex-shrink-0">
                  <span className="text-xs text-slate-500">
                    Total: <strong className="text-slate-800">{categoryCounts.all}</strong> locked slots ({categoryCounts.lab}h Lab, {categoryCounts.theory}h Theory)
                  </span>
                  <button
                    type="button"
                    onClick={() => setShowPrefixManagerModal(false)}
                    className="px-4 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition"
                  >
                    Close Manager
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 6: Generation Step (Backtracking CSP Solver)
    // -------------------------------------------------------------
    function GenerationStep({
      sections,
      subjects,
      faculty,
      allocations,
      prefixedSlots,
      scheduleConfig,
      tallyReport,
      onGenerate,
      isGenerating,
      generationStats,
      hasGeneratedTimetable,
      onViewMaster,
      onAutoBalance,
    }) {
      const constraints = [
        {
          id: 1,
          name: 'Zero Faculty Collision & Other-Dept Barrier',
          desc: 'Zero faculty collisions at (day, period), strictly respecting their external Other Department Locked Load.',
          status: 'Active & Verified',
        },
        {
          id: 2,
          name: 'Saturday Period 5 Strictly Disabled',
          desc: 'Saturday Period 5 remains completely empty and skipped for all classes and faculty members.',
          status: 'Active & Verified',
        },
        {
          id: 3,
          name: 'Prefix Inviolability',
          desc: 'Pre-assigned theory, labs, unit tests, library, and other-dept faculty hours are strictly immovable.',
          status: 'Active & Verified',
        },
        {
          id: 4,
          name: 'Continuous Lab Allocation (No Lunch Split)',
          desc: 'Labs are allocated in 2 or 3 continuous periods within morning or afternoon session; never split across lunch break.',
          status: 'Active & Verified',
        },
        {
          id: 5,
          name: 'Balanced Distribution & Spread Constraint',
          desc: 'Theory courses distributed across distinct days (1 hr/day, max 2) with varied timings and morning/afternoon proportionality.',
          status: 'Active & Verified',
        },
        {
          id: 6,
          name: 'No Consecutive Fatigue Prevention',
          desc: 'Prevents back-to-back continuous periods of the same theory course or faculty in the same class.',
          status: 'Active & Verified',
        },
      ];

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center space-y-6">
            <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 text-white flex items-center justify-center mx-auto shadow-lg shadow-indigo-100">
              <Icons.Cpu className="w-8 h-8" />
            </div>

            <div className="max-w-xl mx-auto">
              <h2 className="text-2xl font-bold text-slate-900">Autonomous Timetable Generation Engine</h2>
              <p className="text-sm text-slate-500 mt-2">
                Utilizes Backtracking Constraint Satisfaction Programming (CSP) with MRV heuristics, randomized restarts, and hard other-department collision barriers.
              </p>
            </div>

            {!tallyReport.isReady ? (
              <div className="p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs flex flex-col sm:flex-row items-center justify-between gap-3 text-left">
                <div className="flex items-center space-x-2.5">
                  <Icons.AlertTriangle className="w-5 h-5 text-amber-600 flex-shrink-0" />
                  <div>
                    <p className="font-bold">Pre-Flight Tally Reconciliation</p>
                    <p className="text-amber-700">Some sections have unfilled period gaps. Auto-balance them in 1-click to proceed.</p>
                  </div>
                </div>
                <button
                  onClick={onAutoBalance}
                  className="px-3.5 py-1.5 rounded-lg bg-amber-600 text-white font-semibold text-xs whitespace-nowrap hover:bg-amber-700 transition"
                >
                  Auto-Balance Now
                </button>
              </div>
            ) : (
              <div className="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs flex items-center justify-center space-x-2">
                <Icons.CheckCircle className="w-5 h-5 text-emerald-600" />
                <span className="font-semibold">All Pre-Flight Tally Gates Passed (100% Balanced). Ready for Generation!</span>
              </div>
            )}

            <div className="flex justify-center items-center gap-3 pt-2">
              <button
                onClick={onGenerate}
                disabled={isGenerating}
                className="px-8 py-3.5 rounded-2xl text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-xl shadow-indigo-200 flex items-center space-x-2.5 transition disabled:opacity-50"
              >
                <Icons.Sparkles className={`w-5 h-5 ${isGenerating ? 'animate-spin' : ''}`} />
                <span>{isGenerating ? 'Solving CSP Constraints...' : 'Run Auto-Generation Algorithm'}</span>
              </button>

              {hasGeneratedTimetable && (
                <button
                  onClick={onViewMaster}
                  className="px-6 py-3.5 rounded-2xl text-sm font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 transition"
                >
                  View Master Grid &rarr;
                </button>
              )}
            </div>

            {generationStats && (
              <div className="pt-6 border-t border-slate-100 grid grid-cols-2 md:grid-cols-4 gap-3 text-left">
                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">Execution Time</span>
                  <p className="text-lg font-bold text-slate-800">{generationStats.executionTimeMs} ms</p>

                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">Periods Scheduled</span>
                  <p className="text-lg font-bold text-indigo-600">{generationStats.totalSlotsScheduled}</p>
                </div>
                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">CSP Iterations</span>

                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                  <span className="text-[10px] font-bold text-slate-400 uppercase">Faculty Clashes</span>
                  <p className="text-lg font-bold text-emerald-600">0 (Zero Collision)</p>

          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-slate-900 text-sm uppercase tracking-wider text-slate-500">
              Active Hard & Soft Mathematical Constraints
            </h3>

            <div className="space-y-3">
              {constraints.map((c) => (
                <div key={c.id} className="p-3.5 rounded-xl border border-slate-100 bg-slate-50/60 flex items-start justify-between gap-4">
                  <div className="flex items-start space-x-3">
                    <span className="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center flex-shrink-0 mt-0.5">
                      ✓
