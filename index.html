                      <h4 className="font-bold text-slate-900 text-xs">{c.name}</h4>
                      <p className="text-[11px] text-slate-500 mt-0.5">{c.desc}</p>
                    </div>
                  </div>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 whitespace-nowrap">
                    {c.status}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 7: Interactive Master Timetable & Drag-and-Swap
    // -------------------------------------------------------------
    function MasterTimetableStep({
      timetable,
      setTimetable,
      sections,
      subjects,
      faculty,
      facultyMap,
      scheduleConfig,
      selectedSectionId,
      setSelectedSectionId,
      showToast,
      undoStack,
      setUndoStack,
      onRegenerate,
    }) {
      const [draggedCoord, setDraggedCoord] = useState(null);
      const [dragOverCoord, setDragOverCoord] = useState(null);
      const [swapError, setSwapError] = useState(null);

      const currentSection = useMemo(() => {
        return sections.find((s) => s.id === selectedSectionId) || sections[0];
      }, [sections, selectedSectionId]);

      if (!timetable) {
        return (
          <div className="bg-white p-12 rounded-2xl border border-slate-200 text-center max-w-lg mx-auto shadow-sm space-y-4">
            <Icons.Calendar className="w-12 h-12 text-slate-300 mx-auto" />
            <h3 className="text-lg font-bold text-slate-800">No Timetable Generated Yet</h3>
            <p className="text-sm text-slate-500">
              Run the CSP Backtracking Generator to create automated schedules for all classes.
            </p>
            <button
              onClick={onRegenerate}
              className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition"
            >
              Generate Timetable Now
            </button>
          </div>
        );
      }

      const secTimetable = timetable[selectedSectionId] || {};

      const handleDragStart = (e, day, period) => {
        setDraggedCoord({ day, period });
        e.dataTransfer.setData('text/plain', JSON.stringify({ day, period }));
      };

      const handleDragOver = (e, day, period) => {
        e.preventDefault();
        setDragOverCoord({ day, period });
      };

      const handleDragLeave = () => {
        setDragOverCoord(null);
      };

      const handleDrop = (e, targetDay, targetPeriod) => {
        e.preventDefault();
        setDragOverCoord(null);

        if (!draggedCoord) return;
        if (draggedCoord.day === targetDay && draggedCoord.period === targetPeriod) return;

        // Perform Conflict Check (including Saturday P5 and Other-Dept Loads!)
        const validation = window.TimetableCore.DragSwapEngine.validateSwap({
          timetable,
          sectionId: selectedSectionId,
          source: draggedCoord,
          target: { day: targetDay, period: targetPeriod },
          sections,
          facultyMap,
          facultyList: faculty,
          scheduleConfig,
        });

        if (!validation.canSwap) {
          setSwapError({
            conflicts: validation.conflicts,
            source: draggedCoord,
            target: { day: targetDay, period: targetPeriod },
          });
          showToast(`Swap Blocked: ${validation.conflicts[0]}`, 'error');
          return;
        }

        // Push to Undo Stack
        setUndoStack((prev) => [JSON.parse(JSON.stringify(timetable)), ...prev.slice(0, 10)]);

        // Execute Swap
        const updated = window.TimetableCore.DragSwapEngine.executeSwap({
          timetable,
          sectionId: selectedSectionId,
          source: draggedCoord,
          target: { day: targetDay, period: targetPeriod },
        });

        setTimetable(updated);
        setDraggedCoord(null);
        showToast(`Successfully swapped ${draggedCoord.day} P${draggedCoord.period} ↔ ${targetDay} P${targetPeriod}!`, 'success');
      };

      const handleUndo = () => {
        if (undoStack.length === 0) return;
        const previous = undoStack[0];
        setTimetable(previous);
        setUndoStack((prev) => prev.slice(1));
        showToast('Reverted last manual swap.', 'info');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 no-print">
            <div>
              <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Icons.Calendar className="w-6 h-6 text-indigo-600" />
                Interactive Master Timetable & Drag-and-Swap
              </h2>
              <p className="text-sm text-slate-500 mt-1">
                Drag cards to swap periods. <strong>Saturday Period 5 is strictly disabled</strong> and other-department faculty loads are hard-locked.
              </p>
            </div>

            <div className="flex items-center space-x-2">
              {undoStack.length > 0 && (
                <button
                  onClick={handleUndo}
                  className="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 flex items-center space-x-1.5 transition"
                >
                  <Icons.Undo className="w-4 h-4" />
                  <span>Undo Swap ({undoStack.length})</span>
                </button>
              )}

              <button
                onClick={() => window.print()}
                className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 flex items-center space-x-1.5 transition"
              >
                <Icons.Printer className="w-4 h-4" />
                <span>Print Timetable</span>
              </button>
            </div>
          </div>

          {/* Section Pills */}
          <div className="flex items-center space-x-2 overflow-x-auto pb-1 no-print">
            {sections.map((sec) => (
              <button
                key={sec.id}
                onClick={() => setSelectedSectionId(sec.id)}
                className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                  selectedSectionId === sec.id
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100'
                    : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'
                }`}
              >
                {sec.year === 1 ? '1st' : sec.year === 2 ? '2nd' : sec.year === 3 ? '3rd' : '4th'} Yr - {sec.name}
              </button>
            ))}
          </div>

          {/* Grid View */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 print-container">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3 no-print">
              <div className="flex items-center space-x-2">
                <span className="font-bold text-slate-900 text-base">
                  {currentSection.year === 1 ? '1st' : currentSection.year === 2 ? '2nd' : currentSection.year === 3 ? '3rd' : '4th'} Year - {currentSection.name}
                </span>
                <span className="text-xs font-mono px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                  Room: {currentSection.roomNumber || 'N/A'}
                </span>
                <span className="text-xs px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-medium">
                  Mentor: {currentSection.mentorFacultyId && facultyMap[currentSection.mentorFacultyId] ? facultyMap[currentSection.mentorFacultyId].name : 'N/A'}
                </span>
              </div>

              <span className="text-xs text-slate-400">
                &bull; Saturday P5 Disabled &bull; Drag cards onto slots to swap &bull;
              </span>
            </div>

            <div className="overflow-x-auto border border-slate-200 rounded-xl">
              <table className="w-full text-center border-collapse">
                <thead>
                  <tr className="bg-slate-50 text-xs font-semibold text-slate-600 border-b border-slate-200">
                    <th className="p-3 text-left w-28 border-r border-slate-200">Day</th>
                    {scheduleConfig.periods.map((p) => (
                      <React.Fragment key={p.id}>
                        <th className="p-3 border-r border-slate-200 min-w-[130px]">
                          <div className="font-bold text-slate-800">{p.name}</div>
                          <div className="text-[10px] font-normal text-slate-400">{p.time}</div>
                        </th>
                        {p.id === scheduleConfig.lunchBreak.afterPeriod && (
                          <th className="p-3 bg-amber-50/70 text-amber-800 text-[11px] font-bold border-r border-slate-200 min-w-[70px]">
                            LUNCH BREAK
                          </th>
                        )}
                      </React.Fragment>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-xs">
                  {scheduleConfig.days.map((day) => {
                    return (
                      <tr key={day} className="h-24">
                        <td className="p-3 text-left font-bold text-slate-800 border-r border-slate-200 bg-slate-50/40">
                          {day}
                        </td>

                        {scheduleConfig.periods.map((p) => {
                          const isDisabled = window.TimetableCore.TallyEngine.isSlotDisabled(day, p.id, scheduleConfig);
                          const cell = secTimetable[day] ? secTimetable[day][p.id] : null;
                          const isHovered = dragOverCoord && dragOverCoord.day === day && dragOverCoord.period === p.id;

                          return (
                            <React.Fragment key={p.id}>
                              <td
                                onDragOver={(e) => !isDisabled && handleDragOver(e, day, p.id)}
                                onDragLeave={handleDragLeave}
                                onDrop={(e) => !isDisabled && handleDrop(e, day, p.id)}
                                className={`p-1.5 border-r border-slate-200 align-top transition-all ${
                                  isDisabled
                                    ? 'disabled-slot-pattern'
                                    : isHovered
                                    ? 'drop-target-hover'
                                    : 'hover:bg-slate-50/50'
                                }`}
                              >
                                {isDisabled ? (
                                  <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                    <span className="font-bold text-[10px] tracking-wider text-slate-500">DISABLED</span>
                                    <span className="text-[9px] text-slate-400">Sat P5 Off</span>
                                  </div>
                                ) : cell ? (
                                  <div
                                    draggable={!cell.isLocked && !cell.isDisabled}
                                    onDragStart={(e) => handleDragStart(e, day, p.id)}
                                    className={`draggable-card h-full p-2 rounded-xl text-left flex flex-col justify-between border shadow-xs transition ${
                                      cell.isLocked
                                        ? 'bg-slate-100 border-slate-300 text-slate-700'
                                        : cell.isLab
                                        ? 'bg-fuchsia-50/80 border-fuchsia-200 text-fuchsia-950'
                                        : cell.type === 'SELF_STUDY'
                                        ? 'bg-slate-50 border-slate-200 text-slate-600'
                                        : 'bg-indigo-50/80 border-indigo-200 text-indigo-950'
                                    } ${cell.isClash ? 'clash-highlight' : ''}`}
                                  >
                                    <div>
                                      <div className="flex items-center justify-between mb-1">
                                        <span className="font-mono text-[10px] font-bold px-1.5 py-0.2 rounded bg-white/80 shadow-xs border border-slate-200/50">
                                          {cell.subjectCode || 'FIXED'}
                                        </span>
                                        {cell.isLocked ? (
                                          <Icons.Lock className="w-3 h-3 text-slate-400" />
                                        ) : cell.isLab ? (
                                          <span className="text-[9px] font-bold text-fuchsia-700 bg-fuchsia-100 px-1 rounded">LAB</span>
                                        ) : null}
                                      </div>
                                      <p className="font-bold text-[11px] leading-tight line-clamp-2">
                                        {cell.subjectName || cell.label}
                                      </p>
                                    </div>

                                    <div className="mt-1 pt-1 border-t border-slate-200/40 text-[10px] font-medium text-slate-600 truncate">
                                      {cell.facultyNames && cell.facultyNames.length > 0 ? (
                                        <span className="text-indigo-700 font-semibold truncate">
                                          {cell.facultyNames.join(', ')}
                                        </span>
                                      ) : (
                                        <span className="text-slate-400 italic">Self-Study</span>
                                      )}
                                    </div>
                                  </div>
                                ) : (
                                  <div className="h-full flex items-center justify-center text-slate-300 text-xs">
                                    Free
                                  </div>
                                )}
                              </td>

                              {p.id === scheduleConfig.lunchBreak.afterPeriod && (
                                <td className="p-1 bg-amber-50/50 border-r border-slate-200 text-amber-800 text-[10px] font-bold">
                                  LUNCH
                                </td>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Swap Conflict Alert Modal */}
          {swapError && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-rose-200 max-w-md w-full p-6 animate-in fade-in zoom-in duration-150">
                <div className="flex items-center space-x-3 text-rose-600 mb-3">
                  <div className="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center flex-shrink-0">
                    <Icons.AlertTriangle className="w-5 h-5 text-rose-600" />
                  </div>
                  <div>
                    <h3 className="text-base font-bold text-slate-900">Constraint Violation Detected</h3>
                    <p className="text-xs text-rose-600">Manual swap blocked by Clash Engine</p>
                  </div>
                </div>

                <div className="bg-rose-50/70 p-4 rounded-xl border border-rose-100 text-xs text-rose-900 space-y-2 mb-4">
                  {swapError.conflicts.map((c, i) => (
                    <p key={i} className="leading-relaxed font-medium">
                      &bull; {c}
                    </p>
                  ))}
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setSwapError(null)}
                    className="px-4 py-2 text-xs font-semibold text-white bg-slate-800 hover:bg-slate-900 rounded-xl transition"
                  >
                    Acknowledge
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 8: Faculty Workload Matrix & Other-Dept Badge View
    // -------------------------------------------------------------
    function FacultyMatrixStep({
      faculty,
      timetable,
      sections,
      subjects,
      scheduleConfig,
      selectedFacultyId,
      setSelectedFacultyId,
      setFaculty,
      showToast,
      setTimetable,
      allocations,
    }) {
      const activeFaculty = useMemo(() => {
        return faculty.find((f) => f.id === selectedFacultyId) || faculty[0];
      }, [faculty, selectedFacultyId]);

      const [showFacultyEditModal, setShowFacultyEditModal] = useState(false);
      const [modalTab, setModalTab] = useState('external'); // 'external' or 'profile'
      const [profileForm, setProfileForm] = useState({
        name: '',
        department: '',
        designation: '',
        email: '',
        maxWorkloadHours: 18,
      });
      const [externalForm, setExternalForm] = useState({
        day: 'Tuesday',
        period: 2,
        department: 'ECE',
        subject: '',
        hours: 1,
      });

      const scheduleData = useMemo(() => {
        if (!activeFaculty) return null;
        return window.TimetableCore.FacultyScheduleEngine.getFacultySchedule(
          activeFaculty.id,
          activeFaculty,
          timetable,
          sections,
          scheduleConfig
        );
      }, [activeFaculty, timetable, sections, scheduleConfig]);

      const handleOpenEditModal = (targetFaculty, tab = 'external') => {
        if (!targetFaculty) return;
        setProfileForm({
          name: targetFaculty.name,
          department: targetFaculty.department,
          designation: targetFaculty.designation,
          email: targetFaculty.email,
          maxWorkloadHours: targetFaculty.maxWorkloadHours,
        });
        setExternalForm({
          day: 'Tuesday',
          period: 2,
          department: 'ECE',
          subject: '',
          hours: 1,
        });
        setModalTab(tab);
        setShowFacultyEditModal(true);
      };

      const handleCellClickFree = (day, period) => {
        if (window.TimetableCore.TallyEngine.isSlotDisabled(day, period, scheduleConfig)) {
          showToast(`Action Blocked: ${day} Period ${period} is disabled by schedule rules.`, 'warning');
          return;
        }
        setProfileForm({
          name: activeFaculty.name,
          department: activeFaculty.department,
          designation: activeFaculty.designation,
          email: activeFaculty.email,
          maxWorkloadHours: activeFaculty.maxWorkloadHours,
        });
        setExternalForm({
          day: day,
          period: period,
          department: 'ECE',
          subject: '',
          hours: 1,
        });
        setModalTab('external');
        setShowFacultyEditModal(true);
      };

      const handleRemoveExternalSlot = (extId) => {
        if (!confirm('Unlock and remove this other-department slot?')) return;
        setFaculty((prev) =>
          prev.map((f) => {
            if (f.id === activeFaculty.id) {
              const current = f.externalLoads || [];
              return { ...f, externalLoads: current.filter((e) => e.id !== extId) };
            }
            return f;
          })
        );
        showToast('Removed other-department locked slot.', 'info');
      };

      const handleAddExternalSlot = (e) => {
        e.preventDefault();
        const periodNum = Number(externalForm.period);

        if (window.TimetableCore.TallyEngine.isSlotDisabled(externalForm.day, periodNum, scheduleConfig)) {
          showToast(`Cannot lock: ${externalForm.day} Period ${periodNum} is strictly disabled.`, 'warning');
          return;
        }

        const existingExt = (activeFaculty.externalLoads || []).find(
          (ext) => ext.day === externalForm.day && ext.period === periodNum
        );
        if (existingExt) {
          showToast(`Faculty is already locked in ${existingExt.department} on ${externalForm.day} Period ${periodNum}.`, 'warning');
          return;
        }

        const newExt = {
          id: 'ext-' + Math.random().toString(36).substring(2, 9),
          day: externalForm.day,
          period: periodNum,
          department: externalForm.department.trim() || 'Other',
          subject: externalForm.subject.trim() || 'External Course',
          hours: Number(externalForm.hours) || 1,
        };

        setFaculty((prev) =>
          prev.map((f) => {
            if (f.id === activeFaculty.id) {
              const current = f.externalLoads || [];
              return { ...f, externalLoads: [...current, newExt] };
            }
            return f;
          })
        );

        showToast(
          `Locked other-department slot on ${newExt.day} Period ${newExt.period} (${newExt.department} - ${newExt.subject}) for ${activeFaculty.name}!`,
          'success'
        );
        setExternalForm((prev) => ({ ...prev, subject: '' }));
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        setFaculty((prev) =>
          prev.map((f) => {
            if (f.id === activeFaculty.id) {
              return {
                ...f,
                name: profileForm.name,
                department: profileForm.department,
                designation: profileForm.designation,
                email: profileForm.email,
                maxWorkloadHours: Number(profileForm.maxWorkloadHours) || 18,
              };
            }
            return f;
          })
        );
        showToast(`Updated faculty details for ${profileForm.name}.`, 'success');
        setShowFacultyEditModal(false);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Icons.Grid className="w-6 h-6 text-indigo-600" />
                Faculty Workload Matrix (Dedicated Box View)
              </h2>
              <p className="text-sm text-slate-500 mt-1">
                Inspect weekly teaching schedules, lock other-department hours, and edit faculty workloads directly from this worksheet.
              </p>
            </div>

            <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 w-full sm:w-auto">
              <div className="w-full sm:w-72">
                <select
                  value={selectedFacultyId}
                  onChange={(e) => setSelectedFacultyId(e.target.value)}
                  className="w-full text-xs font-semibold border border-slate-200 rounded-xl px-3.5 py-2.5 bg-white focus:ring-2 focus:ring-indigo-500"
                >
                  {faculty.map((f) => (
                    <option key={f.id} value={f.id}>
                      {f.name} ({f.department} - {f.designation})
                    </option>
                  ))}
                </select>
              </div>

              <button
                onClick={() => handleOpenEditModal(activeFaculty, 'external')}
                className="px-4 py-2.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm flex items-center justify-center space-x-1.5 transition"
              >
                <Icons.Edit className="w-3.5 h-3.5" />
                <span>Edit Faculty & Other-Dept Hours</span>
              </button>
            </div>
          </div>

          {/* Metric Bar */}
          {scheduleData && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Internal Teaching Hours</span>
                <p className="text-2xl font-bold text-slate-900 mt-1">
                  {scheduleData.totalTeachingHours} <span className="text-xs font-normal text-slate-400">hrs</span>
                </p>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Other-Dept Locked Hours</span>
                <p className="text-2xl font-bold text-amber-600 mt-1">
                  {scheduleData.totalExternalHours} <span className="text-xs font-normal text-slate-400">hrs locked</span>
                </p>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Workload Utilization</span>
                <p className="text-2xl font-bold text-indigo-600 mt-1">
                  {scheduleData.totalHoursAssigned} / {activeFaculty.maxWorkloadHours} hrs{' '}
                  <span className="text-xs font-normal text-slate-400">
                    ({Math.round((scheduleData.totalHoursAssigned / activeFaculty.maxWorkloadHours) * 100)}%)
                  </span>
                </p>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Clashes Detected</span>
                <p className={`text-2xl font-bold mt-1 ${scheduleData.clashesCount > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                  {scheduleData.clashesCount > 0 ? `${scheduleData.clashesCount} CLASHES` : '0 (Clash-Free)'}
                </p>
              </div>
            </div>
          )}

          {/* Faculty Schedule Grid */}
          {scheduleData && (
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-100 pb-3 gap-3">
                <div className="flex items-center space-x-3">
                  <div
                    className="w-10 h-10 rounded-full text-white text-xs font-bold flex items-center justify-center shadow-sm"
                    style={{ backgroundColor: activeFaculty.color || '#4f46e5' }}
                  >
                    {activeFaculty.name.split(' ').map((n) => n[0]).slice(0, 2).join('')}
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <h3 className="font-bold text-slate-900 text-base">{activeFaculty.name}</h3>
                      <button
                        onClick={() => handleOpenEditModal(activeFaculty, 'profile')}
                        className="text-xs text-indigo-600 hover:text-indigo-800 underline font-medium"
                      >
                        Edit Profile
                      </button>
                    </div>
                    <p className="text-xs text-slate-500 font-medium">
                      {activeFaculty.designation} &bull; {activeFaculty.department} Dept &bull; {activeFaculty.email}
                    </p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-3 text-xs">
                  <span className="flex items-center space-x-1 text-slate-600">
                    <span className="w-3 h-3 rounded bg-indigo-100 border border-indigo-300 inline-block"></span>
                    <span>Department Class</span>
                  </span>
                  <span className="flex items-center space-x-1 text-amber-800 font-semibold">
                    <span className="w-3 h-3 rounded bg-amber-100 border border-amber-400 inline-block"></span>
                    <span>OTHER DEPT LOAD (LOCKED)</span>
                  </span>
                  <span className="flex items-center space-x-1 text-slate-400">
                    <span className="w-3 h-3 rounded disabled-slot-pattern inline-block"></span>
                    <span>Saturday P5 Disabled</span>
                  </span>
                </div>
              </div>

              <div className="overflow-x-auto border border-slate-200 rounded-xl">
                <table className="w-full text-center border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-xs font-semibold text-slate-600 border-b border-slate-200">
                      <th className="p-3 text-left w-28 border-r border-slate-200">Day</th>
                      {scheduleConfig.periods.map((p) => (
                        <React.Fragment key={p.id}>
                          <th className="p-3 border-r border-slate-200 min-w-[130px]">
                            <div className="font-bold text-slate-800">{p.name}</div>
                            <div className="text-[10px] font-normal text-slate-400">{p.time}</div>
                          </th>
                          {p.id === scheduleConfig.lunchBreak.afterPeriod && (
                            <th className="p-3 bg-amber-50/70 text-amber-800 text-[11px] font-bold border-r border-slate-200 min-w-[70px]">
                              LUNCH
                            </th>
                          )}
                        </React.Fragment>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 text-xs">
                    {scheduleConfig.days.map((day) => {
                      return (
                        <tr key={day} className="h-20">
                          <td className="p-3 text-left font-bold text-slate-800 border-r border-slate-200 bg-slate-50/40">
                            {day}
                          </td>

                          {scheduleConfig.periods.map((p) => {
                            const slot = scheduleData.schedule[day] ? scheduleData.schedule[day][p.id] : null;

                            return (
                              <React.Fragment key={p.id}>
                                <td className={`p-1.5 border-r border-slate-200 align-top ${slot?.status === 'DISABLED' ? 'disabled-slot-pattern' : ''}`}>
                                  {slot?.status === 'DISABLED' ? (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                      <span className="font-bold text-[10px] text-slate-500">DISABLED</span>
                                      <span className="text-[9px] text-slate-400">Sat P5 Off</span>
                                    </div>
                                  ) : slot?.status === 'OTHER_DEPT' ? (
                                    <div className="h-full p-2 rounded-xl other-dept-locked-card text-left flex flex-col justify-between border relative group">
                                      <div>
                                        <div className="flex items-center justify-between">
                                          <span className="text-[8.5px] font-bold px-1.5 py-0.5 rounded bg-amber-600 text-white tracking-wider uppercase">
                                            OTHER DEPT LOAD
                                          </span>
                                          <button
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              handleRemoveExternalSlot(slot.external.id);
                                            }}
                                            className="text-amber-800 hover:text-rose-600 text-xs opacity-0 group-hover:opacity-100 transition p-0.5"
                                            title="Unlock & Remove External Slot"
                                          >
                                            <Icons.Trash className="w-3.5 h-3.5" />
                                          </button>
                                        </div>
                                        <p className="font-bold text-amber-950 text-[11px] mt-1 leading-tight line-clamp-1">
                                          {slot.external ? slot.external.subject : 'External Class'}
                                        </p>
                                      </div>
                                      <div className="text-[10px] font-semibold text-amber-800 flex justify-between items-center">
                                        <span>Dept: {slot.external ? slot.external.department : 'Other'}</span>
                                        <span className="font-mono text-[9px] bg-amber-200/60 px-1 rounded">{slot.external ? slot.external.hours : 1}h</span>
                                      </div>
                                    </div>
                                  ) : slot?.status === 'CLASH' ? (
                                    <div className="h-full p-2 rounded-xl bg-rose-50 border border-rose-300 text-rose-800 flex flex-col justify-center clash-highlight text-left">
                                      <span className="font-bold text-[11px] text-rose-700">DOUBLE BOOKED CLASH!</span>
                                      <span className="text-[10px] text-rose-900 mt-1">
                                        {slot.isExternalClash ? `Clash with ${slot.external?.department} Dept!` : 'Internal Section Clash!'}
                                      </span>
                                    </div>
                                  ) : slot?.status === 'OCCUPIED' ? (
                                    <div className="h-full p-2 rounded-xl bg-indigo-50/90 border border-indigo-200 text-left flex flex-col justify-between">
                                      <div>
                                        <div className="flex items-center justify-between">
                                          <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-indigo-600 text-white">
                                            {slot.section ? slot.section.name : slot.sectionId}
                                          </span>
                                          {slot.cell?.isLab && (
                                            <span className="text-[8px] font-bold px-1 rounded bg-pink-100 text-pink-700">LAB</span>
                                          )}
                                        </div>
                                        <p className="font-bold text-slate-900 text-[11px] mt-1 leading-tight line-clamp-1">
                                          {slot.cell ? slot.cell.subjectName : 'Teaching'}
                                        </p>
                                      </div>
                                      <div className="text-[10px] text-slate-500 font-medium">
                                        Room: {slot.section ? slot.section.roomNumber : 'LH'}
                                      </div>
                                    </div>
                                  ) : (
                                    <div
                                      onClick={() => handleCellClickFree(day, p.id)}
                                      className="h-full p-2 rounded-xl bg-slate-50/80 hover:bg-amber-50/60 border border-slate-200 hover:border-amber-300 text-slate-400 hover:text-amber-700 flex flex-col items-center justify-center space-y-1 cursor-pointer transition group"
                                      title="Click to lock an Other-Department hour here"
                                    >
                                      <Icons.Coffee className="w-3.5 h-3.5 text-slate-300 group-hover:hidden" />
                                      <Icons.Plus className="w-3.5 h-3.5 text-amber-500 hidden group-hover:block" />
                                      <span className="text-[10px] font-semibold tracking-wider group-hover:hidden">FREE</span>
                                      <span className="text-[9px] font-bold text-amber-600 hidden group-hover:block">+ Lock Other Dept</span>
                                    </div>
                                  )}
                                </td>

                                {p.id === scheduleConfig.lunchBreak.afterPeriod && (
                                  <td className="p-1 bg-amber-50/40 border-r border-slate-200 text-amber-700 text-[10px] font-bold">
                                    Lunch
                                  </td>
                                )}
                              </React.Fragment>
                            );
                          })}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Modal for Editing Faculty & Other-Dept Hours */}
          {showFacultyEditModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-xl w-full p-6 animate-in fade-in zoom-in duration-150">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <Icons.UserCheck className="w-5 h-5 text-indigo-600" />
                      Manage Faculty & Workload: {activeFaculty.name}
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">
                      {activeFaculty.designation} &bull; {activeFaculty.department} Department
                    </p>
                  </div>
                  <button onClick={() => setShowFacultyEditModal(false)} className="text-slate-400 hover:text-slate-600 text-xl">
                    &times;
                  </button>
                </div>

                {/* Tabs */}
                <div className="flex rounded-xl bg-slate-100 p-1 mb-4">
                  <button
                    type="button"
                    onClick={() => setModalTab('external')}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
                      modalTab === 'external' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Other-Dept Locked Hours ({(activeFaculty.externalLoads || []).length})
                  </button>
                  <button
                    type="button"
                    onClick={() => setModalTab('profile')}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
                      modalTab === 'profile' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Profile & Max Workload
                  </button>
                </div>

                {modalTab === 'external' ? (
                  <div className="space-y-4">
                    {/* List of currently locked external slots */}
                    <div>
                      <h4 className="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                        Currently Locked External Department Slots:
                      </h4>
                      {(!activeFaculty.externalLoads || activeFaculty.externalLoads.length === 0) ? (
                        <p className="text-xs text-slate-400 italic bg-slate-50 p-3 rounded-xl border border-slate-100">
                          No other-department commitments locked yet for {activeFaculty.name}.
                        </p>
                      ) : (
                        <div className="space-y-1.5 max-h-44 overflow-y-auto pr-1">
                          {activeFaculty.externalLoads.map((ext) => (
                            <div
                              key={ext.id}
                              className="flex items-center justify-between p-2.5 rounded-xl bg-amber-50/70 border border-amber-200 text-xs"
                            >
                              <div className="flex items-center space-x-2">
                                <span className="font-bold text-amber-900 px-2 py-0.5 rounded bg-amber-200 text-[10px]">
                                  {ext.department} DEPT
                                </span>
                                <div>
                                  <span className="font-semibold text-slate-800">{ext.subject}</span>
                                  <span className="text-[11px] text-amber-800 block">
                                    {ext.day} &bull; Period {ext.period} ({ext.hours || 1} hr)
                                  </span>
                                </div>
                              </div>
                              <button
                                onClick={() => handleRemoveExternalSlot(ext.id)}
                                className="text-slate-400 hover:text-rose-600 p-1 transition"
                                title="Delete this locked commitment"
                              >
                                <Icons.Trash className="w-4 h-4" />
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* Add new external commitment form */}
                    <form onSubmit={handleAddExternalSlot} className="border-t border-slate-100 pt-4 space-y-3">
                      <h4 className="text-xs font-bold text-slate-900 flex items-center gap-1.5">
                        <Icons.Plus className="w-3.5 h-3.5 text-indigo-600" />
                        Add New Other-Department Commitment
                      </h4>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-600 mb-1">Day</label>
                          <select
                            value={externalForm.day}
                            onChange={(e) => setExternalForm({ ...externalForm, day: e.target.value })}
                            className="w-full text-xs font-semibold px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white"
                          >
                            {scheduleConfig.days.map((d) => (
                              <option key={d} value={d}>
                                {d}
                              </option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-600 mb-1">Period Number</label>
                          <select
                            value={externalForm.period}
                            onChange={(e) => setExternalForm({ ...externalForm, period: Number(e.target.value) })}
                            className="w-full text-xs font-semibold px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white"
                          >
                            {scheduleConfig.periods.map((p) => {
                              const isSatP5 = externalForm.day === 'Saturday' && p.id === 5;
                              return (
                                <option key={p.id} value={p.id} disabled={isSatP5}>
                                  Period {p.id} ({p.time}) {isSatP5 ? '- DISABLED' : ''}
                                </option>
                              );
                            })}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-600 mb-1">Other Department</label>
                          <input
                            type="text"
                            required
                            placeholder="e.g. ECE, MECH, CIVIL"
                            value={externalForm.department}
                            onChange={(e) => setExternalForm({ ...externalForm, department: e.target.value })}
                            className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-600 mb-1">Subject Name</label>
                          <input
                            type="text"
                            required
                            placeholder="e.g. Microprocessors, Robotics"
                            value={externalForm.subject}
                            onChange={(e) => setExternalForm({ ...externalForm, subject: e.target.value })}
                            className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                      </div>

                      <div className="flex justify-end pt-2">
                        <button
                          type="submit"
                          className="px-4 py-2 text-xs font-semibold text-white bg-amber-600 hover:bg-amber-700 rounded-xl shadow-sm transition"
                        >
                          + Lock Slot in {externalForm.department || 'Other'} Dept
                        </button>
                      </div>
                    </form>
                  </div>
                ) : (
                  <form onSubmit={handleSaveProfile} className="space-y-3.5">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Faculty Name</label>
                      <input
                        type="text"
                        required
                        value={profileForm.name}
                        onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })}
                        className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Department</label>
                        <input
                          type="text"
                          required
                          value={profileForm.department}
                          onChange={(e) => setProfileForm({ ...profileForm, department: e.target.value })}
                          className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Designation</label>
                        <input
                          type="text"
                          required
                          value={profileForm.designation}
                          onChange={(e) => setProfileForm({ ...profileForm, designation: e.target.value })}
                          className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Email</label>
                        <input
                          type="email"
                          required
                          value={profileForm.email}
                          onChange={(e) => setProfileForm({ ...profileForm, email: e.target.value })}
                          className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Max Workload (Hours/Week)</label>
                        <input
                          type="number"
                          required
                          min={6}
                          max={35}
                          value={profileForm.maxWorkloadHours}
                          onChange={(e) => setProfileForm({ ...profileForm, maxWorkloadHours: e.target.value })}
                          className="w-full text-xs px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                    </div>

                    <div className="flex justify-end space-x-3 pt-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setShowFacultyEditModal(false)}
                        className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                      >
                        Close
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition"
                      >
                        Save Profile Changes
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // STEP 9: Export Options & System Presets
    // -------------------------------------------------------------
    function ExportCenterStep({
      timetable,
      sections,
      subjects,
      faculty,
      allocations,
      prefixedSlots,
      scheduleConfig,
      setFaculty,
      setSubjects,
      setSections,
      setAllocations,
      setPrefixedSlots,
      setScheduleConfig,
      setTimetable,
      showToast,
    }) {
      const handleExportMasterExcel = () => {
        if (!timetable) {
          showToast('Generate a timetable first before exporting to Excel.', 'error');
          return;
        }
        window.ExportUtils.exportMasterToExcel(timetable, sections, subjects, faculty, allocations, scheduleConfig);
        showToast('Multi-tab Master Timetable Excel file generated and downloaded!', 'success');
      };

      const handleBackupJSON = () => {
        const fullBackup = {
          version: '3.0',
          exportedAt: new Date().toISOString(),
          faculty,
          subjects,
          sections,
          allocations,
          prefixedSlots,
          scheduleConfig,
          timetable,
        };

        const jsonString = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(fullBackup, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', jsonString);
        downloadAnchor.setAttribute('download', `EduSchedule_Backup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Full system state exported as JSON!', 'success');
      };

      const handleRestoreJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.faculty && data.subjects && data.sections) {
              setFaculty(data.faculty);
              setSubjects(data.subjects);
              setSections(data.sections);
              if (data.allocations) setAllocations(data.allocations);
              if (data.prefixedSlots) setPrefixedSlots(data.prefixedSlots);
              if (data.scheduleConfig) setScheduleConfig(data.scheduleConfig);
              if (data.timetable) setTimetable(data.timetable);
              showToast('Complete timetable state restored successfully!', 'success');
            } else {
              showToast('Invalid backup file structure.', 'error');
            }
          } catch (err) {
            showToast('Failed to parse JSON file.', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Icons.Download className="w-6 h-6 text-indigo-600" />
                Export Center & System Management
              </h2>
              <p className="text-sm text-slate-500 mt-1">
                Export institutional multi-worksheet Excel workbooks (with other-dept loads and Saturday P5 marked), printable PDF reports, and full JSON backups.
              </p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Master Excel */}
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 flex flex-col justify-between">
              <div>
                <div className="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-3">
                  <Icons.Download className="w-6 h-6" />
                </div>
                <h3 className="font-bold text-slate-900 text-lg">Master Timetable Excel (.xlsx)</h3>
                <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                  Generates an institutional multi-tab workbook powered by SheetJS:
                </p>
                <ul className="text-xs text-slate-600 mt-2 space-y-1 list-disc list-inside">
                  <li>Separate dedicated tab for every Class/Section (Sat P5 marked OFF)</li>
                  <li>Master consolidated summary grid across all sections</li>
                  <li>Faculty teaching workload & other-department locked load sheet</li>
                </ul>
              </div>

              <button
                onClick={handleExportMasterExcel}
                className="w-full py-3 px-4 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md shadow-emerald-100 flex items-center justify-center space-x-2 transition"
              >
                <Icons.Download className="w-4 h-4" />
                <span>Download Master Excel Workbook</span>
              </button>
            </div>

            {/* Printable PDF */}
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 flex flex-col justify-between">
              <div>
                <div className="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-3">
                  <Icons.Printer className="w-6 h-6" />
                </div>
                <h3 className="font-bold text-slate-900 text-lg">Printable PDF Timetable</h3>
                <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                  Clean landscape format for official college noticeboards and departmental records:
                </p>
                <ul className="text-xs text-slate-600 mt-2 space-y-1 list-disc list-inside">
                  <li>Official institutional header & department banner</li>
                  <li>Mentor details, classroom venue, and Saturday P5 marked disabled</li>
                  <li>Official 4-signature approval block (HOD, Coordinator, Principal)</li>
                </ul>
              </div>

              <button
                onClick={() => window.print()}
                className="w-full py-3 px-4 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md shadow-indigo-100 flex items-center justify-center space-x-2 transition"
              >
                <Icons.Printer className="w-4 h-4" />
                <span>Open Printable View / Save as PDF</span>
              </button>
            </div>

            {/* Template Downloads */}
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 flex flex-col justify-between">
              <div>
                <div className="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-3">
                  <Icons.BookOpen className="w-6 h-6" />
                </div>
                <h3 className="font-bold text-slate-900 text-lg">Sample Excel & CSV Templates</h3>
                <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                  Download standard spreadsheet templates pre-formatted with sample columns for bulk uploading faculty and curriculum data.
                </p>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => window.ExportUtils.downloadFacultyTemplate('xlsx')}
                  className="flex-1 py-2.5 px-3 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition"
                >
                  Faculty Template (.xlsx)
                </button>
                <button
                  onClick={() => window.ExportUtils.downloadSubjectTemplate('xlsx')}
                  className="flex-1 py-2.5 px-3 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition"
                >
                  Subject Template (.xlsx)
                </button>
              </div>
            </div>

            {/* Full State Backup */}
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 flex flex-col justify-between">
              <div>
                <div className="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center mb-3">
                  <Icons.Sparkles className="w-6 h-6" />
                </div>
                <h3 className="font-bold text-slate-900 text-lg">Full System Backup & Restore</h3>
                <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                  Export complete application state (Faculty, Other-Dept Loads, Subjects, Sections, Allocations, and Generated Timetable) to JSON.
                </p>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={handleBackupJSON}
                  className="flex-1 py-2.5 px-3 rounded-xl text-xs font-semibold text-amber-800 bg-amber-50 hover:bg-amber-100 border border-amber-200 transition"
                >
                  Export Backup (JSON)
                </button>

                <label className="flex-1 cursor-pointer py-2.5 px-3 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 text-center transition">
                  <span>Restore from JSON</span>
                  <input type="file" accept=".json" onChange={handleRestoreJSON} className="hidden" />
                </label>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Mount Root React Component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
